/* ---------------- charts ---------------- */
function drawSCurve() {
  const host = $("#scurve"); if (!host) return;
  const pts = S.ev.series.points, W = Math.max(320, host.clientWidth), H = W < 520 ? 230 : 290, P = { l: 58, r: 14, t: 12, b: 28 };
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const maxV = Math.max(...pts.map(p => Math.max(p.pv, p.ev || 0, p.ac || 0, p.fc || 0))) * 1.05;
  const X = t => P.l + (t - t0) / (t1 - t0) * (W - P.l - P.r), Y = v => H - P.b - v / maxV * (H - P.t - P.b);
  const step = maxV > 4e7 ? 1e7 : maxV > 2e7 ? 5e6 : maxV > 4e6 ? 1e6 : 2.5e5;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative planned value, earned value, actual cost and forecast">`;
  for (let v = 0; v <= maxV; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end">${money(v).replace(".00M", "M")}</text>`;
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const d0 = new Date(t0); let mt = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1), k = 0; const every = W < 520 ? 3 : 2;
  while (mt < t1) { const d = new Date(mt); if (k++ % every === 0) g += `<text x="${X(mt)}" y="${H - 8}" text-anchor="middle">${MON[d.getUTCMonth()]}${d.getUTCMonth() === 0 ? " " + String(d.getUTCFullYear()).slice(2) : ""}</text>`; mt = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); }
  const line = (key, col, dash) => { const p = pts.filter(q => q[key] != null); if (!p.length) return ""; return `<path d="${p.map((q, i) => (i ? "L" : "M") + X(q.t).toFixed(1) + " " + Y(q[key]).toFixed(1)).join("")}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" ${dash ? 'stroke-dasharray="5 4"' : ""}/>`; };
  const pvArea = `<path d="M${X(t0)} ${Y(0)}${pts.map(q => "L" + X(q.t).toFixed(1) + " " + Y(q.pv).toFixed(1)).join("")}L${X(t1)} ${Y(0)}Z" fill="var(--s-pv)" opacity="0.07"/>`;
  g += pvArea + line("pv", "var(--s-pv)") + line("fc", "var(--s-fc)", true) + line("ac", "var(--s-ac)") + line("ev", "var(--s-ev)");
  const xd = X(S.m.dataDate);
  g += `<line x1="${xd}" x2="${xd}" y1="${P.t}" y2="${H - P.b}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2 3"/><text x="${xd + 5}" y="${P.t + 10}" style="fill:var(--accent);font-weight:600">Data date</text>`;
  const last = pts.filter(p => p.ev != null).pop();
  if (last) [["ev", "var(--s-ev)"], ["ac", "var(--s-ac)"]].forEach(([k, c]) => g += `<circle cx="${X(last.t)}" cy="${Y(last[k])}" r="4.5" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`);
  const fl = pts[pts.length - 1];
  g += `<text x="${W - P.r}" y="${Y(fl.fc) - 8}" text-anchor="end" style="fill:var(--ink-2);font-weight:600">EAC ${money(fl.fc)}</text>`;
  g += `<line id="xh" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/><rect x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
  host.innerHTML = g;
  const svg = host.querySelector("svg"), tip = host.querySelector("#tip"), xh = host.querySelector("#xh");
  const move = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width;
    const t = t0 + (sx - P.l) / (W - P.l - P.r) * (t1 - t0);
    let best = pts[0]; for (const p of pts) if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
    const x = X(best.t); xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.setAttribute("visibility", "visible");
    tip.hidden = false; tip.style.left = (x * r.width / W) + "px"; tip.style.top = (Y(best.pv) * r.height / H) + "px";
    const row = (c, l, v) => v == null ? "" : `<div><span class="sw" style="background:${c}"></span>${l} <b>${money(v)}</b></div>`;
    tip.innerHTML = `<div style="opacity:.75">Week of ${E.fmt(best.t)}</div>${row("var(--s-pv)", "Planned", best.pv)}${row("var(--s-ev)", "Earned", best.ev)}${row("var(--s-ac)", "Actual", best.ac)}${best.ev == null ? row("var(--s-fc)", "Forecast", best.fc) : ""}`;
  };
  host.querySelector("#hit").addEventListener("pointermove", move);
  host.querySelector("#hit").addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
}
function drawHist() {
  const host = $("#hist"); if (!host) return;
  const f = facts(), mc = S.mc, W = Math.max(320, host.clientWidth), H = 230, P = { l: 36, r: 12, t: 22, b: 30 };
  const lo = mc.finishes[0], hi = mc.finishes[mc.finishes.length - 1];
  const binW = Math.max(1, Math.ceil((hi - lo + 1) / 28)), bins = [];
  for (let v = lo; v <= hi; v += binW) bins.push({ a: v, b: v + binW - 1, n: 0 });
  mc.finishes.forEach(v => bins[Math.min(bins.length - 1, Math.floor((v - lo) / binW))].n++);
  const maxN = Math.max(...bins.map(b => b.n)), bw = (W - P.l - P.r) / bins.length;
  const X = v => P.l + (v - lo) / (hi - lo + binW) * (W - P.l - P.r), Y = n => H - P.b - n / maxN * (H - P.t - P.b);
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram of simulated finish dates">`;
  [0.5, 1].forEach(fr => g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(maxN * fr)}" y2="${Y(maxN * fr)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${Y(maxN * fr) + 4}" text-anchor="end">${Math.round(100 * maxN * fr / mc.N)}%</text>`);
  const p80 = mc.P80;
  bins.forEach((b, k) => { const x = P.l + k * bw; g += `<rect class="hb" data-k="${k}" x="${x + 1}" y="${Y(b.n)}" width="${Math.max(1, bw - 2)}" height="${H - P.b - Y(b.n)}" rx="2" fill="${b.a > p80 ? "var(--s-fc)" : "var(--s-pv)"}" opacity="${b.a > p80 ? 0.55 : 0.9}"/>`; });
  const mark = (v, l, c) => { const x = X(v + 0.5); return `<line x1="${x}" x2="${x}" y1="${P.t - 6}" y2="${H - P.b}" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${x}" y="${P.t - 9}" text-anchor="middle" style="fill:${c};font-weight:600">${l}</text>`; };
  g += mark(mc.P50, "P50", "var(--ink-2)") + mark(mc.P80, "P80", "var(--ink)");
  if (f.fm && f.fm.cstrDate) { const tv = E.idx(f.fm.cstrDate) + 1 + (S.s.PF - S.s.EF[f.fm.i]); if (tv >= lo - binW && tv <= hi + binW) g += mark(Math.min(hi, Math.max(lo, tv)), "Target", "var(--bad)"); }
  const ticks = 5; for (let k = 0; k <= ticks; k++) { const v = lo + (hi - lo) * k / ticks; g += `<text x="${X(v)}" y="${H - 9}" text-anchor="middle">${E.fmt(E.dateOf(Math.round(v) - 1), "short")}</text>`; }
  g += `</svg><div class="tip" id="htip" hidden></div>`;
  host.innerHTML = g;
  const tip = host.querySelector("#htip"), svg = host.querySelector("svg");
  host.querySelectorAll(".hb").forEach(r => {
    r.addEventListener("pointerenter", () => { const b = bins[+r.dataset.k], rc = svg.getBoundingClientRect(); tip.hidden = false;
      tip.style.left = ((+r.getAttribute("x") + bw / 2) * rc.width / W) + "px"; tip.style.top = (+r.getAttribute("y") * rc.height / H) + "px";
      tip.innerHTML = `${E.fmt(E.dateOf(b.a - 1), "short")}${b.b > b.a ? " to " + E.fmt(E.dateOf(b.b - 1), "short") : ""}<br><b>${b.n}</b> runs (${(100 * b.n / mc.N).toFixed(1)}%)`; });
    r.addEventListener("pointerleave", () => tip.hidden = true);
  });
}

function md(src) {
  const lines = esc(src).split(/\n/); let out = "", list = false;

  for (const l of lines) {
    const t = l.trim();
    if (/^[-*•] /.test(t)) { if (!list) { out += "<ul>"; list = true; } out += "<li>" + inline(t.slice(2)) + "</li>"; continue; }
    if (list) { out += "</ul>"; list = false; }
    if (/^#{1,4} /.test(t)) out += "<h4>" + inline(t.replace(/^#+ /, "")) + "</h4>";
    else if (t) out += "<p>" + inline(t) + "</p>";
  }
  return out + (list ? "</ul>" : "");
}

  else if (act === "copy-narr") { const txt = S.narrative; navigator.clipboard.writeText(txt).then(() => toast("Copied"), () => { const r = document.createRange(); r.selectNodeContents($("#narr-doc")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Press Ctrl+C to copy"); }); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#drawer-host").innerHTML = ""; });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawSCurve(); drawHist(); }, 150); });

load(SAMPLE_XER, "sample");
(async () => {
  if (!window.claude || !window.claude.use) return;
  const [sm, dl] = await Promise.all([window.claude.use("sample").catch(() => null), window.claude.use("downloads").catch(() => null)]);
  S.caps.sample = sm; S.caps.downloads = dl;
  if (sm || dl) render();
})();
