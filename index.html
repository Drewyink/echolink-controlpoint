<title>Echolink ControlPoint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of workspaces, one scrolling work surface; collapses to a top tab strip on phones */
:root {
  --bg: #F1F4F9; --surface: #FFFFFF; --sunk: #EBEEF3; --line: #D9DEE6; --line-2: #C3CAD5;
  --ink: #121A26; --ink-2: #44506A; --ink-3: #6B768C;
  --accent: #D9581A; --accent-ink: #FFFFFF; --accent-soft: #FCE9DD;
  --rail: #121A26; --rail-ink: #C9D1DE; --rail-active: #FFFFFF;
  --good: #0F7B4F; --good-soft: #DFF3E9; --warn: #9A6200; --warn-soft: #FBF0D6; --bad: #C2272D; --bad-soft: #FBE3E3;
  --s-pv: #2F6BD8; --s-ev: #0E9384; --s-ac: #E8641E; --s-fc: #6B768C; --bl: #B9C1CE; --crit: #C2272D; --bar: #2F6BD8;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
  --glow-a: rgba(47,107,216,0.20); --glow-b: rgba(232,100,30,0.14); --glow-c: rgba(14,147,132,0.10); --gridline: rgba(30,55,100,0.07); --bg-top: #E3EAF6;
  --panel-shadow: 0 1px 2px rgba(16,30,60,0.05), 0 8px 24px rgba(16,30,60,0.06);
  --hero-bg: #0B1322; --hero-ink: #F2F5FA; --hero-ink-2: #A9B5C9; --hero-line: rgba(255,255,255,0.10); --hero-card: rgba(255,255,255,0.05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A0F18; --surface: #131A26; --sunk: #1B2330; --line: #283244; --line-2: #36425A;
  --ink: #E7ECF3; --ink-2: #B0BACB; --ink-3: #8592A8;
  --accent: #EF7A3C; --accent-ink: #1A0D05; --accent-soft: #3A2215;
  --rail: #070B12; --rail-ink: #93A0B5; --rail-active: #FFFFFF;
  --good: #3CC48A; --good-soft: #12301F; --warn: #E4AE45; --warn-soft: #33270E; --bad: #F06A6E; --bad-soft: #3A1719;
  --s-pv: #5A8CEB; --s-ev: #16A08C; --s-ac: #E3692A; --s-fc: #8592A8; --bl: #3E4A60; --crit: #F06A6E; --bar: #5A8CEB;
  --glow-a: rgba(90,140,235,0.22); --glow-b: rgba(239,122,60,0.16); --glow-c: rgba(22,160,140,0.12); --gridline: rgba(160,190,240,0.05); --bg-top: #101A2C;
  --panel-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A0F18; --surface: #131A26; --sunk: #1B2330; --line: #283244; --line-2: #36425A;
  --ink: #E7ECF3; --ink-2: #B0BACB; --ink-3: #8592A8;
  --accent: #EF7A3C; --accent-ink: #1A0D05; --accent-soft: #3A2215;
  --rail: #070B12; --rail-ink: #93A0B5; --rail-active: #FFFFFF;
  --good: #3CC48A; --good-soft: #12301F; --warn: #E4AE45; --warn-soft: #33270E; --bad: #F06A6E; --bad-soft: #3A1719;
  --s-pv: #5A8CEB; --s-ev: #16A08C; --s-ac: #E3692A; --s-fc: #8592A8; --bl: #3E4A60; --crit: #F06A6E; --bar: #5A8CEB;
  --glow-a: rgba(90,140,235,0.22); --glow-b: rgba(239,122,60,0.16); --glow-c: rgba(22,160,140,0.12); --gridline: rgba(160,190,240,0.05); --bg-top: #101A2C;
  --panel-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.25);
  color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background:
    radial-gradient(1100px 620px at 92% -8%, var(--glow-a), transparent 62%),
    radial-gradient(820px 520px at 18% -6%, var(--glow-b), transparent 58%),
    radial-gradient(900px 700px at 60% 110%, var(--glow-c), transparent 60%),
    linear-gradient(180deg, var(--bg-top) 0, var(--bg) 560px);
  background-color: var(--bg); background-attachment: fixed; color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 0.86em; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.15; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
.eyebrow { font: 600 0.72rem/1.2 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
/* rail */
.rail { background: linear-gradient(180deg, #0B1322 0%, #0E1729 55%, #121A2B 100%); color: var(--rail-ink); padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; flex-direction: column; gap: 10px; padding: 4px 4px 0; }
.brand .logo { display: block; width: 100%; max-width: 184px; height: auto; }
.brand .product { font: 600 0.78rem/1 var(--f-body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--rail-active); padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.12); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 5px; font-weight: 500; color: var(--rail-ink); }
.nav button:hover { background: rgba(255,255,255,0.06); color: var(--rail-active); }
.nav button[aria-current="page"] { background: rgba(232,100,30,0.16); color: var(--rail-active); box-shadow: inset 2px 0 0 #E8641E; }
.nav button:focus-visible { outline: 2px solid #E8641E; }
.nav .cnt { font: 500 0.72rem var(--f-mono); padding: 1px 6px; border-radius: 99px; background: rgba(255,255,255,0.08); }
.nav .cnt.bad { background: rgba(240,106,110,0.22); color: #FFB3B5; }
.rail-foot { margin-top: auto; font-size: 0.75rem; line-height: 1.45; }
.rail-foot a { color: var(--rail-active); }
/* main */
.main { position: relative; isolation: isolate; min-width: 0; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
  background-size: 44px 44px; -webkit-mask-image: linear-gradient(180deg, #000 0, rgba(0,0,0,.6) 380px, transparent 900px); mask-image: linear-gradient(180deg, #000 0, rgba(0,0,0,.6) 380px, transparent 900px); }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.topbar .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 0.88rem; margin-top: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; box-shadow: var(--panel-shadow); }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
@media (max-width: 980px) { .g-main { grid-template-columns: minmax(0, 1fr); } }
/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; box-shadow: var(--panel-shadow); }
.panel .kpis { box-shadow: none; }
.kpi { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi .v { font: 600 1.7rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 0.82rem; color: var(--ink-2); }
.tone-bad { color: var(--bad); } .tone-good { color: var(--good); } .tone-warn { color: var(--warn); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.neutral { background: var(--sunk); color: var(--ink-2); }
.chip svg { width: 11px; height: 11px; }
/* attention list */
.alerts { display: flex; flex-direction: column; }
.alert { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: start; }
.alert:first-child { border-top: 0; }
.alert .sev { align-self: stretch; border-radius: 2px; }
.alert .sev.bad { background: var(--bad); } .alert .sev.warn { background: var(--warn); } .alert .sev.good { background: var(--good); }
.alert b { font-weight: 600; }
.alert p { margin: 2px 0 0; color: var(--ink-2); font-size: 0.88rem; }
/* tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th { text-align: left; font: 600 0.7rem/1.2 var(--f-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--sunk); }
tr.sel { background: var(--accent-soft) !important; }
/* toolbar */
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 5px 11px; font-size: 0.84rem; font-weight: 500; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
input[type=search], input[type=number], input[type=text], select, textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 6px 9px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
/* gantt */
.gantt { overflow: auto; max-height: 640px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.gantt svg { display: block; }
.gantt text { font-family: var(--f-body); fill: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
/* health */
.score { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ring { width: 92px; height: 92px; flex: none; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
.check { box-shadow: var(--panel-shadow); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 13px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.check.fail { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.check .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.check .val { font: 600 1.35rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.check .thr { font-size: 0.78rem; color: var(--ink-3); }
.check p { margin: 0; font-size: 0.85rem; color: var(--ink-2); }
.check details summary { cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); }
.codes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.codes button { all: unset; cursor: pointer; font: 500 0.75rem var(--f-mono); padding: 1px 6px; border-radius: 4px; background: var(--sunk); }
.codes button:hover { background: var(--accent-soft); }
.bar-meter { height: 6px; border-radius: 3px; background: var(--sunk); position: relative; overflow: hidden; }
.bar-meter span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--f-body); font-size: 11px; fill: var(--ink-3); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 6px; font-size: 0.8rem; line-height: 1.45; white-space: nowrap; z-index: 5; transform: translate(-50%, calc(-100% - 10px)); }
.tip[hidden] { display: none; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(10,15,25,0.18); z-index: 30; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-h { display: flex; justify-content: space-between; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer-b { overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 0.88rem; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
/* assistant */
.chat { display: flex; flex-direction: column; gap: 14px; min-height: 360px; }
.msg { max-width: 760px; }
.msg.user { align-self: flex-end; background: var(--sunk); padding: 9px 13px; border-radius: 10px 10px 2px 10px; }
.msg.ai { border-left: 2px solid var(--accent); padding: 2px 0 2px 14px; }
.msg.ai h4 { font: 600 1rem var(--f-display); margin: 10px 0 4px; }
.msg.ai p { margin: 6px 0; } .msg.ai ul { margin: 6px 0; padding-left: 20px; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 200px; }
.prompts { display: flex; flex-wrap: wrap; gap: 6px; }
.prompts button { all: unset; cursor: pointer; font-size: 0.84rem; padding: 5px 11px; border: 1px solid var(--line-2); border-radius: 99px; color: var(--ink-2); }
.prompts button:hover { border-color: var(--accent); color: var(--ink); }
.prompts button:focus-visible { outline: 2px solid var(--accent); }
.doc { max-width: 72ch; font-size: 0.95rem; }
.doc h4 { font: 600 1.05rem var(--f-display); margin: 18px 0 4px; }
.doc p { margin: 6px 0; } .doc ul { margin: 6px 0; padding-left: 20px; }
.note { font-size: 0.84rem; color: var(--ink-2); background: var(--sunk); border-radius: 6px; padding: 9px 12px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 8px; padding: 16px; text-align: center; color: var(--ink-2); font-size: 0.9rem; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.range { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.range label { display: flex; flex-direction: column; gap: 3px; font-size: 0.8rem; color: var(--ink-3); }
.range input { width: 92px; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 6px; font-size: 0.88rem; z-index: 40; }
.skeleton { color: var(--ink-3); font-style: italic; }
/* welcome */
.hero { position: relative; overflow: hidden; border-radius: 14px; background:
    radial-gradient(700px 380px at 88% 0%, rgba(90,140,235,0.32), transparent 65%),
    radial-gradient(520px 340px at 0% 100%, rgba(232,100,30,0.28), transparent 62%),
    linear-gradient(135deg, #0B1322 0%, #0F1B33 60%, #101A2C 100%);
  color: var(--hero-ink); padding: clamp(24px, 4vw, 48px); display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 0.85fr); gap: 36px; align-items: center; box-shadow: 0 20px 50px rgba(8,16,32,0.25); }
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 36px 36px; -webkit-mask-image: radial-gradient(ellipse at 70% 30%, #000 0, transparent 70%); mask-image: radial-gradient(ellipse at 70% 30%, #000 0, transparent 70%); }
.hero > * { position: relative; }
.hero .eyebrow { color: #F2884A; }
.hero h1 { font-size: clamp(1.9rem, 3.6vw, 2.9rem); line-height: 1.05; margin: 10px 0 16px; color: var(--hero-ink); }
.hero h1 em { font-style: normal; color: #F2884A; }
.hero p.lede { font-size: 1.06rem; line-height: 1.6; color: var(--hero-ink-2); max-width: 60ch; margin: 0 0 22px; }
.hero .btn { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.22); color: var(--hero-ink); }
.hero .btn:hover { border-color: rgba(255,255,255,0.5); }
.hero .btn.primary { background: #E8641E; border-color: #E8641E; color: #fff; }
.hero .fine { font-size: 0.82rem; color: var(--hero-ink-2); margin-top: 14px; display: flex; align-items: center; gap: 7px; }
.hero .fine svg { width: 14px; height: 14px; flex: none; color: #3CC48A; }
.readout { background: var(--hero-card); border: 1px solid var(--hero-line); border-radius: 12px; padding: 18px; backdrop-filter: blur(6px); }
.readout .rh { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 0.8rem; color: var(--hero-ink-2); }
.readout .live { display: inline-flex; align-items: center; gap: 6px; color: #7FE0C8; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: .7rem; }
.readout .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3CC48A; box-shadow: 0 0 0 3px rgba(60,196,138,0.25); }
.readout .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hero-line); }
.readout .row span { color: var(--hero-ink-2); font-size: 0.86rem; }
.readout .row b { font: 600 1.25rem/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--hero-ink); }
.readout .row b.bad { color: #FF8D90; } .readout .row b.warn { color: #F2C46B; }
.readout svg { display: block; width: 100%; height: 54px; margin-top: 6px; }
.feat { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 255px), 1fr)); gap: 14px; }
.feat button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--panel-shadow); transition: border-color .15s, transform .15s; }
.feat button:hover { border-color: var(--accent); transform: translateY(-1px); }
.feat button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.feat .ic { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.feat .ic svg { width: 18px; height: 18px; }
.feat h3 { margin-top: 4px; }
.feat p { margin: 0; color: var(--ink-2); font-size: 0.9rem; }
.feat .go { margin-top: auto; padding-top: 6px; font-size: 0.82rem; font-weight: 600; color: var(--accent); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 0; counter-reset: st; }
.steps li { list-style: none; padding: 4px 22px 4px 0; display: flex; flex-direction: column; gap: 6px; }
.steps li + li { padding-left: 22px; border-left: 1px solid var(--line); }
.steps .n { font: 700 0.78rem var(--f-mono); color: var(--accent); }
.steps p { margin: 0; color: var(--ink-2); font-size: 0.9rem; }
.who { display: flex; flex-wrap: wrap; gap: 8px; }
.who span { padding: 6px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 0.86rem; color: var(--ink-2); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 0.84rem; color: var(--ink-3); padding-top: 14px; border-top: 1px solid var(--line); }
.foot .sel { user-select: all; color: var(--ink-2); }
/* comparison, recovery, demo */
.cmp-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px; }
.demo { background: linear-gradient(135deg, var(--surface) 0%, var(--accent-soft) 160%); }
.demo-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 28px; align-items: start; }
.ticks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.ticks li { padding-left: 24px; position: relative; color: var(--ink-2); }
.ticks li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 10px; height: 5px; border-left: 2px solid var(--good); border-bottom: 2px solid var(--good); transform: rotate(-45deg); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields label { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); min-width: 0; }
.fields label.full { grid-column: 1 / -1; }
.fields input, .fields select, .fields textarea { font-weight: 400; font-size: 0.92rem; padding: 8px 10px; width: 100%; }
.dm-status { margin: 10px 0 0; font-size: 0.88rem; min-height: 1.2em; }
.sel { user-select: all; }
.rail-cta { all: unset; cursor: pointer; display: block; text-align: center; padding: 9px 10px; border-radius: 6px; background: #E8641E; color: #fff; font-weight: 600; font-size: 0.86rem; margin-bottom: 10px; }
.rail-cta:hover { filter: brightness(1.08); } .rail-cta:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
@media (max-width: 860px) { .demo-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) { .fields { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } .steps li + li { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 10px; } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: 0; height: auto; z-index: 20; flex-direction: row; align-items: center; gap: 12px; padding-block: 10px; padding-right: max(14px, env(safe-area-inset-right, 0px)); overflow-x: auto; }
  .rail-foot, .brand .product { display: none; }
  .brand { flex: none; padding: 0; } .brand .logo { width: 118px; }
  .nav { flex-direction: row; }
  .nav button { padding: 7px 9px; white-space: nowrap; }
  .nav .cnt { display: none; }
  h1 { font-size: 1.4rem; }
  .kpi .v { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .25s ease-out; } @keyframes fade { from { opacity: .4 } to { opacity: 1 } } }

<script>
/* ControlPoint analytics engine: XER parsing, CPM, DCMA 14, EVM, Monte Carlo. */
(function (root) {
  "use strict";
  const DAY = 86400000;
  const EPOCH = Date.UTC(2020, 0, 6); // a Monday

  /* ---------- Working-day calendar (Mon to Fri) ---------- */
  function parseDate(s) {
    if (!s) return null;
    const m = String(s).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (!m) return null;
    return Date.UTC(+m[1], +m[2] - 1, +m[3]);
  }
  function idx(t) { // workday index of a UTC timestamp; weekends roll forward
    const days = Math.round((t - EPOCH) / DAY);
    const w = Math.floor(days / 7), r = ((days % 7) + 7) % 7;
    return w * 5 + Math.min(r, 5);
  }
  function dateOf(i) {
    const w = Math.floor(i / 5), r = ((i % 5) + 5) % 5;
    return EPOCH + (w * 7 + r) * DAY;
  }
  function fmt(t, style) {
    if (t == null || isNaN(t)) return "";
    const d = new Date(t);
    const y = d.getUTCFullYear(), mo = d.getUTCMonth(), da = d.getUTCDate();
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    if (style === "iso") return y + "-" + String(mo + 1).padStart(2, "0") + "-" + String(da).padStart(2, "0");
    if (style === "short") return da + " " + MON[mo];
    return da + " " + MON[mo] + " " + y;
  }

  /* ---------- XER parser ---------- */
  function parseXER(text) {
    const tables = {};
    let cur = null, fields = null;
    const lines = String(text).split(/\r?\n/);
    for (const line of lines) {
      if (!line) continue;
      const parts = line.split("\t");
      const tag = parts[0];
      if (tag === "%T") { cur = parts[1]; tables[cur] = []; fields = null; }
      else if (tag === "%F") { fields = parts.slice(1); }
      else if (tag === "%R" && cur && fields) {
        const row = {};
        for (let i = 0; i < fields.length; i++) row[fields[i]] = parts[i + 1] == null ? "" : parts[i + 1];
        tables[cur].push(row);
      }
    }
    if (!tables.TASK) throw new Error("This file has no TASK table. Export the project from P6 as an XER file and try again.");
    return tables;
  }

  /* ---------- Model ---------- */
  const HARD = { CS_MSO: 1, CS_MEO: 1, CS_MSOB: 1, CS_MEOB: 1 };
  const CSTR_LABEL = {
    CS_MSO: "Mandatory start", CS_MEO: "Mandatory finish", CS_MSOA: "Start on or after",
    CS_MSOB: "Start on or before", CS_MEOA: "Finish on or after", CS_MEOB: "Finish on or before",
    CS_ALAP: "As late as possible", CS_SO: "Start on", CS_EO: "Finish on"
  };
  const REL_LABEL = { PR_FS: "FS", PR_SS: "SS", PR_FF: "FF", PR_SF: "SF" };

  function buildModel(t, opts) {
    opts = opts || {};
    const proj = (t.PROJECT && t.PROJECT[0]) || {};
    const projId = opts.projId || proj.proj_id;
    const cal = (t.CALENDAR || [])[0];
    const hpd = cal && +cal.day_hr_cnt > 0 ? +cal.day_hr_cnt : 8;
    const wbs = {};
    (t.PROJWBS || []).forEach(w => {
      if (projId && w.proj_id !== projId) return;
      wbs[w.wbs_id] = { id: w.wbs_id, parent: w.parent_wbs_id, code: w.wbs_short_name, name: w.wbs_name, seq: +w.seq_num || 0, root: w.proj_node_flag === "Y" };
    });
    const cost = {};
    (t.TASKRSRC || []).forEach(r => {
      const c = cost[r.task_id] || (cost[r.task_id] = { bac: 0, ac: 0, etc: 0, n: 0 });
      c.bac += +r.target_cost || 0;
      c.ac += (+r.act_reg_cost || 0) + (+r.act_ot_cost || 0);
      c.etc += +r.remain_cost || 0;
      c.n++;
    });
    const acts = [], byId = {};
    t.TASK.forEach(r => {
      if (projId && r.proj_id !== projId) return;
      if (r.task_type === "TT_WBS") return;
      const isMile = r.task_type === "TT_Mile" || r.task_type === "TT_FinMile";
      const c = cost[r.task_id] || { bac: 0, ac: 0, etc: 0, n: 0 };
      const status = r.status_code === "TK_Complete" ? "C" : r.status_code === "TK_Active" ? "A" : "N";
      const a = {
        i: acts.length, id: r.task_id, code: r.task_code, name: r.task_name, wbsId: r.wbs_id,
        type: r.task_type, mile: isMile, finMile: r.task_type === "TT_FinMile", loe: r.task_type === "TT_LOE",
        status, pct: Math.max(0, Math.min(100, +r.phys_complete_pct || 0)),
        origDur: isMile ? 0 : Math.round((+r.target_drtn_hr_cnt || 0) / hpd),
        remDur: isMile ? 0 : Math.round((+r.remain_drtn_hr_cnt || 0) / hpd),
        actStart: parseDate(r.act_start_date), actFinish: parseDate(r.act_end_date),
        blStart: parseDate(r.target_start_date), blFinish: parseDate(r.target_end_date),
        cstr: r.cstr_type || "", cstrDate: parseDate(r.cstr_date),
        bac: c.bac, ac: c.ac, etc: c.etc, hasRsrc: c.n > 0,
        preds: [], succs: []
      };
      if (status === "C") { a.remDur = 0; a.pct = 100; }
      if (status === "N" && !isMile && a.remDur === 0 && a.origDur > 0) a.remDur = a.origDur;
      acts.push(a); byId[a.id] = a;
    });
    const rels = [];
    (t.TASKPRED || []).forEach(r => {
      const s = byId[r.task_id], p = byId[r.pred_task_id];
      if (!s || !p) return;
      const rel = { p: p.i, s: s.i, type: r.pred_type || "PR_FS", lag: Math.round((+r.lag_hr_cnt || 0) / hpd) };
      rels.push(rel); p.succs.push(rel); s.preds.push(rel);
    });
    const dd = parseDate(proj.last_recalc_date) || parseDate(proj.next_data_date) || Date.now();
    const start = parseDate(proj.plan_start_date) || Math.min(...acts.map(a => a.actStart || a.blStart || Infinity));
    const m = {
      name: proj.proj_short_name || "Project", title: proj.proj_short_name || "Project",
      dataDate: dd, D: idx(dd), start, wbs, acts, rels, byId, hpd,
      plannedFinish: parseDate(proj.plan_end_date) || parseDate(proj.scd_end_date)
    };
    m.topo = topoSort(m);
    return m;
  }

  function topoSort(m) {
    const n = m.acts.length, indeg = new Array(n).fill(0);
    m.rels.forEach(r => indeg[r.s]++);
    const q = [], out = [];
    for (let i = 0; i < n; i++) if (!indeg[i]) q.push(i);
    while (q.length) {
      const i = q.shift(); out.push(i);
      m.acts[i].succs.forEach(r => { if (--indeg[r.s] === 0) q.push(r.s); });
    }
    if (out.length < n) {
      const loop = m.acts.filter((a, i) => indeg[i] > 0).map(a => a.code);
      m.loops = loop;
      for (let i = 0; i < n; i++) if (indeg[i] > 0) out.push(i); // keep going, results flagged
    }
    return out;
  }

  /* ---------- CPM ---------- */
  // Index convention: ES = start of a working day; EF = ES + duration (exclusive).
  // Task finish date = dateOf(EF - 1). Finish milestone date = dateOf(ES - 1).
  function finLimit(a, t) { return (a.mile && !a.finMile) ? idx(t) : idx(t) + 1; }

  function forward(m, dur) {
    const n = m.acts.length, ES = new Float64Array(n), EF = new Float64Array(n), D = m.D, OV = [];
    for (const i of m.topo) {
      const a = m.acts[i], d = dur[i];
      if (a.status === "C") {
        const st = a.actStart != null ? a.actStart : a.actFinish;
        const fi = a.actFinish != null ? a.actFinish : a.actStart;
        if (st == null) { ES[i] = EF[i] = D; continue; }
        if (a.mile) { ES[i] = EF[i] = a.finMile ? idx(fi) + 1 : idx(st); }
        else { ES[i] = idx(st); EF[i] = Math.max(idx(fi) + 1, ES[i]); }
        continue;
      }
      let es = D, efMin = -Infinity;
      if (a.status === "A") {
        es = a.actStart != null ? idx(a.actStart) : D;
        efMin = D + d;
      }
      if (a.status === "N") {
        for (const r of a.preds) {
          const pES = ES[r.p], pEF = EF[r.p];
          let req;
          if (r.type === "PR_SS") req = pES + r.lag;
          else if (r.type === "PR_FF") req = pEF + r.lag - d;
          else if (r.type === "PR_SF") req = pES + r.lag - d;
          else req = pEF + r.lag;
          if (req > es) es = req;
        }
        if (a.cstrDate != null) {
          const c = a.cstr;
          if (c === "CS_MSOA" || c === "CS_SO") es = Math.max(es, idx(a.cstrDate));
          else if (c === "CS_MEOA") es = Math.max(es, finLimit(a, a.cstrDate) - d);
          else if (c === "CS_MSO" || c === "CS_MEO") {
            const forced = c === "CS_MSO" ? idx(a.cstrDate) : finLimit(a, a.cstrDate) - d;
            if (forced < es) OV.push({ i, logic: es, forced });
            es = forced;
          }
        }
        ES[i] = es; EF[i] = es + d;
      } else { // active: remaining work from data date, retained logic on FF/SF
        let ef = efMin;
        for (const r of a.preds) {
          if (r.type === "PR_FF") ef = Math.max(ef, EF[r.p] + r.lag);
          else if (r.type === "PR_SF") ef = Math.max(ef, ES[r.p] + r.lag);
        }
        ES[i] = es; EF[i] = ef;
      }
    }
    let PF = -Infinity;
    for (let i = 0; i < n; i++) if (EF[i] > PF) PF = EF[i];
    return { ES, EF, PF, OV };
  }

  function durations(m, extra) {
    const d = new Float64Array(m.acts.length);
    m.acts.forEach((a, i) => { d[i] = a.status === "C" ? 0 : a.remDur + ((extra && extra[i]) || 0); });
    return d;
  }

  function schedule(m, extra) {
    const dur = durations(m, extra);
    const { ES, EF, PF, OV } = forward(m, dur);
    const n = m.acts.length, LS = new Float64Array(n), LF = new Float64Array(n), TF = new Array(n);
    for (let k = m.topo.length - 1; k >= 0; k--) {
      const i = m.topo[k], a = m.acts[i], d = dur[i];
      let lf = PF;
      for (const r of a.succs) {
        const s = m.acts[r.s];
        if (s.status === "C") continue;
        let v;
        if (r.type === "PR_SS") v = LS[r.s] - r.lag + d;
        else if (r.type === "PR_FF") v = LF[r.s] - r.lag;
        else if (r.type === "PR_SF") v = LF[r.s] - r.lag + d;
        else v = LS[r.s] - r.lag;
        if (v < lf) lf = v;
      }
      if (a.cstrDate != null && a.status !== "C") {
        const c = a.cstr;
        if (c === "CS_MEOB" || c === "CS_EO") lf = Math.min(lf, finLimit(a, a.cstrDate));
        else if (c === "CS_MSOB") lf = Math.min(lf, idx(a.cstrDate) + d);
        else if (c === "CS_MEO") lf = finLimit(a, a.cstrDate);
        else if (c === "CS_MSO") lf = idx(a.cstrDate) + d;
      }
      LF[i] = lf; LS[i] = lf - d;
      TF[i] = a.status === "C" ? null : lf - EF[i];
    }
    const driving = drivingPath(m, ES, EF, dur, PF);
    return { ES, EF, LS, LF, TF, PF, dur, driving, overrides: OV };
  }

  // Walk back from the latest-finishing activity through driving relationships.
  function drivingPath(m, ES, EF, dur, PF, from) {
    const set = new Set();
    let ends = [];
    if (from != null) ends = [from];
    else m.acts.forEach((a, i) => { if (EF[i] === PF && a.status !== "C") ends.push(i); });
    const stack = ends.slice();
    while (stack.length) {
      const i = stack.pop();
      if (set.has(i)) continue;
      set.add(i);
      const a = m.acts[i];
      if (a.status !== "N") continue;
      for (const r of a.preds) {
        if (m.acts[r.p].status === "C") continue;
        let req;
        if (r.type === "PR_SS") req = ES[r.p] + r.lag;
        else if (r.type === "PR_FF") req = EF[r.p] + r.lag - dur[i];
        else if (r.type === "PR_SF") req = ES[r.p] + r.lag - dur[i];
        else req = EF[r.p] + r.lag;
        if (req === ES[i]) stack.push(r.p);
      }
    }
    return set;
  }

  // Display dates for an activity given a schedule
  function startDate(m, s, i) {
    const a = m.acts[i];
    if (a.actStart != null) return a.actStart;
    if (a.finMile) return dateOf(s.ES[i] - 1);
    return dateOf(s.ES[i]);
  }
  function finishDate(m, s, i) {
    const a = m.acts[i];
    if (a.status === "C" && a.actFinish != null) return a.actFinish;
    if (a.mile) return a.finMile ? dateOf(s.EF[i] - 1) : dateOf(s.ES[i]);
    return dateOf(s.EF[i] - 1);
  }
  function projectFinishDate(m, s) {
    let best = -Infinity, bi = -1;
    m.acts.forEach((a, i) => { const f = finishDate(m, s, i); if (f > best) { best = f; bi = i; } });
    return best;
  }

  /* ---------- DCMA 14 point assessment ---------- */
  function dcma(m, s) {
    const inc = m.acts.filter(a => a.status !== "C" && !a.loe);
    const incTasks = inc.filter(a => !a.mile);
    const incSet = new Set(inc.map(a => a.i));
    const relsInc = m.rels.filter(r => incSet.has(r.s));
    const pct = (num, den) => den ? (100 * num / den) : 0;
    const checks = [];
    const add = (o) => checks.push(o);
    const first = m.topo[0];

    const missing = inc.filter(a => {
      const noPred = a.preds.length === 0, noSucc = a.succs.length === 0;
      if (a.mile && !a.finMile && noPred && !noSucc) return false;   // project start milestone
      if (a.finMile && noSucc && !noPred) return false;                // project finish milestone
      return noPred || noSucc;
    });
    add({ id: 1, key: "logic", name: "Logic", desc: "Incomplete activities missing a predecessor or successor", threshold: "≤ 5%", value: pct(missing.length, inc.length), unit: "%", pass: pct(missing.length, inc.length) <= 5, items: missing.map(a => a.i),
      why: "Open ends let activities float freely, so delays do not ripple to the finish date and the critical path can be wrong.",
      fix: "Tie each open end into the network. Give every activity at least one predecessor and one successor, usually finish to start." });

    const leads = relsInc.filter(r => r.lag < 0);
    add({ id: 2, key: "leads", name: "Leads", desc: "Relationships with negative lag", threshold: "0%", value: pct(leads.length, relsInc.length), unit: "%", pass: leads.length === 0, items: leads.map(r => r.s), rels: leads,
      why: "Negative lags assume work can start before its predecessor finishes and hide overlap that should be shown as real activities.",
      fix: "Replace each lead by splitting the predecessor or using a start to start relationship with a positive lag." });

    const lags = relsInc.filter(r => r.lag > 0);
    add({ id: 3, key: "lags", name: "Lags", desc: "Relationships with positive lag", threshold: "≤ 5%", value: pct(lags.length, relsInc.length), unit: "%", pass: pct(lags.length, relsInc.length) <= 5, items: lags.map(r => r.s), rels: lags,
      why: "Lags are invisible durations. They cannot be statused or resourced and make float hard to explain.",
      fix: "Where the lag represents real work or waiting time (cure, review, delivery), model it as an activity." });

    const fs = relsInc.filter(r => r.type === "PR_FS");
    add({ id: 4, key: "reltype", name: "Relationship types", desc: "Finish to start share of relationships", threshold: "≥ 90%", value: pct(fs.length, relsInc.length), unit: "%", pass: pct(fs.length, relsInc.length) >= 90, items: relsInc.filter(r => r.type !== "PR_FS").map(r => r.s),
      why: "Heavy use of SS and FF ties makes the path harder to follow and can mask the true driving logic.",
      fix: "Review each SS and FF tie. Break overlapping activities into smaller pieces linked finish to start." });

    const hard = inc.filter(a => HARD[a.cstr]);
    add({ id: 5, key: "hard", name: "Hard constraints", desc: "Activities with hard date constraints", threshold: "≤ 5%", value: pct(hard.length, inc.length), unit: "%", pass: pct(hard.length, inc.length) <= 5, items: hard.map(a => a.i),
      why: "Hard constraints override logic and can produce negative float or dates that ignore real progress.",
      fix: "Use soft constraints (start on or after) or let logic drive the date. Keep hard constraints for genuine contract dates.",
      note: s.overrides.map(o => `${m.acts[o.i].code} is forced to start ${o.logic - o.forced} working days before its logic allows`).join(". ") });

    const hiFloat = incTasks.filter(a => s.TF[a.i] > 44);
    add({ id: 6, key: "hifloat", name: "High float", desc: "Incomplete tasks with total float over 44 days", threshold: "≤ 5%", value: pct(hiFloat.length, incTasks.length), unit: "%", pass: pct(hiFloat.length, incTasks.length) <= 5, items: hiFloat.map(a => a.i),
      why: "Very high float usually signals missing successor logic rather than real flexibility.",
      fix: "Check the successors of each activity and link it to the work that actually depends on it." });

    const negFloat = incTasks.filter(a => s.TF[a.i] < 0);
    add({ id: 7, key: "negfloat", name: "Negative float", desc: "Incomplete tasks with negative total float", threshold: "0%", value: pct(negFloat.length, incTasks.length), unit: "%", pass: negFloat.length === 0, items: negFloat.map(a => a.i),
      why: "Negative float means the forecast misses a constrained date. The schedule needs a recovery plan.",
      fix: "Develop a recovery plan: resequence, add resources to driving activities, or negotiate the constraint date." });

    const hiDur = incTasks.filter(a => a.origDur > 44);
    add({ id: 8, key: "hidur", name: "High duration", desc: "Incomplete tasks with original duration over 44 days", threshold: "≤ 5%", value: pct(hiDur.length, incTasks.length), unit: "%", pass: pct(hiDur.length, incTasks.length) <= 5, items: hiDur.map(a => a.i),
      why: "Long activities are hard to status accurately and hide the detail needed to manage them.",
      fix: "Break long activities into shorter ones with measurable deliverables, or justify them (procurement lead times)." });

    const dd = m.dataDate;
    const invalid = m.acts.filter(a => (a.actStart != null && a.actStart > dd) || (a.actFinish != null && a.actFinish > dd) || (a.status === "N" && s.ES[a.i] < m.D));
    add({ id: 9, key: "invalid", name: "Invalid dates", desc: "Actual dates after the data date, or forecasts before it", threshold: "0%", value: pct(invalid.length, m.acts.length), unit: "%", pass: invalid.length === 0, items: invalid.map(a => a.i),
      why: "Actuals in the future or forecasts in the past mean the update was not statused correctly.",
      fix: "Correct the actual dates and reschedule from the data date." });

    const noRes = incTasks.filter(a => !a.hasRsrc || a.bac <= 0);
    add({ id: 10, key: "resources", name: "Resources", desc: "Incomplete tasks with no cost or resource loading", threshold: "0%", value: pct(noRes.length, incTasks.length), unit: "%", pass: noRes.length === 0, items: noRes.map(a => a.i),
      why: "Unloaded activities cannot earn value, so cost and schedule performance are understated.",
      fix: "Assign resources or budgeted cost to each task, or mark it as a zero cost activity on purpose." });

    const dueTasks = m.acts.filter(a => !a.mile && a.blFinish != null && a.blFinish <= dd);
    const missed = dueTasks.filter(a => a.status !== "C" || (a.actFinish != null && a.actFinish > a.blFinish));
    add({ id: 11, key: "missed", name: "Missed tasks", desc: "Tasks due by the data date that finished late or not at all", threshold: "≤ 5%", value: pct(missed.length, dueTasks.length), unit: "%", pass: pct(missed.length, dueTasks.length) <= 5, items: missed.map(a => a.i),
      why: "A high miss rate means the baseline is not being met and future dates are optimistic.",
      fix: "Find the common cause of misses (permits, weather, supply) and adjust remaining durations realistically." });

    // Critical path test: delay the first driving incomplete task and confirm the finish moves by the same amount
    const drv = [...s.driving].filter(i => !m.acts[i].mile && m.acts[i].status !== "C");
    let cpt = { pass: false, detail: "No driving task found" };
    if (drv.length) {
      const pick = drv.sort((x, y) => s.ES[x] - s.ES[y])[0];
      const extra = new Float64Array(m.acts.length); extra[pick] = 100;
      const s2 = forward(m, durations(m, extra));
      const moved = s2.PF - s.PF;
      cpt = { pass: moved === 100, detail: `Added 100 days to ${m.acts[pick].code}; finish moved ${moved} days`, pick };
    }
    add({ id: 12, key: "cpt", name: "Critical path test", desc: cpt.detail, threshold: "Pass", value: cpt.pass ? "Pass" : "Fail", unit: "", pass: cpt.pass, items: cpt.pick != null ? [cpt.pick] : [],
      why: "If a delay on the critical path does not move the finish, the network is broken somewhere along it.",
      fix: "Trace the path for constraints or broken logic that absorb the delay." });

    const finIdx = finishMilestone(m, s);
    const cpl = s.PF - m.D;
    const finTF = finIdx != null ? s.TF[finIdx] : 0;
    const cpli = cpl > 0 ? (cpl + finTF) / cpl : 1;
    add({ id: 13, key: "cpli", name: "CPLI", desc: "Critical path length index", threshold: "≥ 0.95", value: cpli, unit: "", pass: cpli >= 0.95, items: [],
      why: "CPLI below 1.0 means the remaining critical path is longer than the time left to the contract date.",
      fix: "Shorten the driving path or reset the target date with the client." });

    const done = dueTasks.filter(a => a.status === "C").length;
    const bei = dueTasks.length ? m.acts.filter(a => !a.mile && a.status === "C").length / dueTasks.length : 1;
    add({ id: 14, key: "bei", name: "BEI", desc: "Baseline execution index", threshold: "≥ 0.95", value: bei, unit: "", pass: bei >= 0.95, items: [],
      why: "BEI compares tasks actually finished with tasks planned to finish by now.",
      fix: "Focus the next periods on clearing overdue tasks before starting new ones." });

    const passed = checks.filter(c => c.pass).length;
    return { checks, passed, score: Math.round(100 * passed / checks.length), inc: inc.length, cpli, bei, finIdx, due: dueTasks.length, done };
  }

  function finishMilestone(m, s) {
    let best = null;
    m.acts.forEach((a, i) => {
      if (a.finMile && a.cstrDate != null) { if (best == null || s.EF[i] > s.EF[best]) best = i; }
    });
    if (best == null) m.acts.forEach((a, i) => { if (a.finMile && (best == null || s.EF[i] > s.EF[best])) best = i; });
    return best;
  }

  /* ---------- Earned value ---------- */
  function spread(total, s, f, t) { // linear spread of total from s to f (timestamps), value at t
    if (s == null || f == null) return 0;
    if (t >= f) return total;
    if (t <= s) return 0;
    return total * (t - s) / Math.max(f - s, DAY);
  }
  function evm(m, s) {
    const t = m.dataDate + DAY - 1;
    let BAC = 0, PV = 0, EV = 0, AC = 0, ETC = 0;
    const byWbs = {};
    m.acts.forEach(a => {
      const pv = spread(a.bac, a.blStart, a.blFinish + DAY, t);
      const ev = a.bac * a.pct / 100;
      BAC += a.bac; PV += pv; EV += ev; AC += a.ac; ETC += a.etc;
      const top = topWbs(m, a.wbsId);
      const w = byWbs[top] || (byWbs[top] = { id: top, BAC: 0, PV: 0, EV: 0, AC: 0, ETC: 0 });
      w.BAC += a.bac; w.PV += pv; w.EV += ev; w.AC += a.ac; w.ETC += a.etc;
    });
    const CPI = AC ? EV / AC : 1, SPI = PV ? EV / PV : 1;
    // Earned schedule
    const series = curves(m, s);
    let esT = m.start;
    for (const p of series.points) { if (p.pv <= EV) esT = p.t; }
    // interpolate within week
    const pts = series.points;
    for (let k = 1; k < pts.length; k++) {

  if (ev.BAC && ev.CPI < 0.98) out.push({ sev: ev.CPI < 0.93 ? "bad" : "warn", title: `Cost efficiency is ${ev.CPI.toFixed(2)} CPI`, body: `Estimate at completion by CPI is ${money(ev.EAC_cpi)}, a ${money(-ev.VAC)} overrun on a ${money(ev.BAC)} budget. To finish on budget the remaining work must run at ${ev.TCPI.toFixed(2)} TCPI.`, go: "cost" });
  const ov = s.overrides[0];
  if (ov) out.push({ sev: "bad", title: `${m.acts[ov.i].code} has a mandatory constraint that overrides logic`, body: `${m.acts[ov.i].name} is forced to start ${ov.logic - ov.forced} working days before its predecessors allow. The forecast for this work is not credible until the constraint is reviewed.`, go: "health" });
  const fails = d.checks.filter(c => !c.pass).map(c => c.name);
  if (fails.length) out.push({ sev: fails.length > 5 ? "bad" : "warn", title: `${fails.length} of 14 DCMA checks fail`, body: fails.slice(0, 6).join(", ") + (fails.length > 6 ? " and more" : "") + ".", go: "health" });
  if (f.pOnTime != null) out.push({ sev: f.pOnTime < 0.5 ? "bad" : f.pOnTime < 0.8 ? "warn" : "good", title: `${Math.round(f.pOnTime * 100)}% chance of meeting ${f.fm.name.toLowerCase()}`, body: `Monte Carlo P50 ${E.fmt(f.p50)}, P80 ${E.fmt(f.p80)} across ${S.mc.N.toLocaleString()} runs.`, go: "risk" });
  if (S.rec && S.rec.plan.length) {
    const x = recoveryResult(S.rec.plan);
    out.splice(1, 0, { sev: "good", title: `Recovery plan found: ${x.gained} working days back for ${money(x.cost)}`, body: `${S.rec.plan.length} actions on the driving path${x.tgt ? (x.late1 <= 0 ? ` bring ${x.tgt.name.toLowerCase()} back to ${E.fmt(x.f1)}, inside its target` : ` move ${x.tgt.name.toLowerCase()} to ${E.fmt(x.f1)}`) : ""}.`, go: "recover" });
  }
  if (S.cmp && S.cmp.findings.length) {
    const c0 = S.cmp.findings[0];

}

/* ---- update comparison ---- */
function loadPrev(text, name) {
  const t = E.parseXER(text);
  const cur = (S.tables.PROJECT || [])[0] || {};
  const match = (t.PROJECT || []).find(p => p.proj_short_name === cur.proj_short_name) || (t.PROJECT || [])[0] || {};
  const m = E.buildModel(t, { projId: match.proj_id });
  if (m.dataDate >= S.m.dataDate) throw new Error(`The previous update must have an earlier data date than the loaded schedule (${E.fmt(S.m.dataDate)}).`);
  S.prev = { m, name };
  computeCompare();
}
function computeCompare() {
  if (!S.prev) { S.cmp = null; return; }
  S.prev.s = E.schedule(S.prev.m);
  S.prev.ev = E.evm(S.prev.m, S.prev.s);
  S.cmp = E.compare(S.prev.m, S.prev.s, S.m, S.s);
  S.cmp.findings = compareFindings(S.cmp);
}
function compareFindings(c) {
  const m = S.m, out = [];
  const editsEarlier = c.attribution.filter(x => x.days > 0), editDays = editsEarlier.reduce((a, x) => a + x.days, 0);
  if (c.finishDelta < 0) {
    const n = -c.finishDelta;
    out.push({ sev: editDays >= n ? "bad" : editDays > 0 ? "warn" : "good", title: `Forecast finish improved ${n} working days`,
      body: editDays > 0 ? `${Math.min(editDays, n)} of those days come from schedule edits, not progress: ${editsEarlier.map(x => x.text).join("; ")}. Without these edits the forecast would be ${E.fmt(E.dateOf(E.idx(c.curFinish) + editDays))}.` : "The improvement is supported by progress, not by schedule edits." });
  } else if (c.finishDelta > 0) {
    const movers = c.rows.filter(r => r.cDrv && r.delta > 0 && r.cStatus !== "C").slice(0, 3);
    out.push({ sev: "bad", title: `Forecast finish slipped ${c.finishDelta} working days`, body: movers.length ? `The driving activities that moved most were ${movers.map(r => `${r.code} ${r.name} (${r.delta} days)`).join(", ")}.` : "Review the activities that moved most in the table below." });
  } else out.push({ sev: "good", title: "Forecast finish held steady", body: `The forecast stayed at ${E.fmt(c.curFinish)}.` });
  c.durChanges.forEach(x => {
    const a = m.acts[x.i];
    if (x.to < x.from) out.push({ sev: x.drv ? "bad" : "warn", title: `${x.code} original duration cut from ${x.from} to ${x.to} days`, body: `${x.name}${a.status === "N" ? " has not started, so no progress supports the change" : ""}. ${x.drv ? "It is on the driving path, so the cut moves the finish date. " : ""}Ask for the basis of estimate before accepting it.` });
    else out.push({ sev: "warn", title: `${x.code} original duration increased from ${x.from} to ${x.to} days`, body: `${x.name}. Confirm the reason and whether the baseline should be revised.` });
  });
  c.relDeleted.forEach(x => {
    const p = m.acts.find(a => a.code === x.predCode);
    const open = p && p.succs.length === 0;
    out.push({ sev: open ? "bad" : "warn", title: `Logic deleted: ${x.predCode} to ${x.succCode}`, body: open ? `${p.code} ${p.name} now has no successor. Delays on it can no longer reach the finish date.` : "Confirm the relationship was removed on purpose." });
  });
  if (c.relAdded.length) out.push({ sev: "warn", title: `${c.relAdded.length} relationship${c.relAdded.length > 1 ? "s" : ""} added`, body: c.relAdded.slice(0, 5).map(x => `${m.acts[x.pred].code} to ${m.acts[x.succ].code} (${x.type})`).join(", ") + "." });
  if (c.relChanged.length) out.push({ sev: "warn", title: `${c.relChanged.length} relationship${c.relChanged.length > 1 ? "s" : ""} changed type or lag`, body: c.relChanged.slice(0, 5).map(x => `${m.acts[x.pred].code} to ${m.acts[x.succ].code} (${x.from} became ${x.to})`).join(", ") + "." });
  c.cstrChanges.forEach(x => {
    const at = c.attribution.find(y => y.kind === "constraint" && y.code === x.code);
    out.push({ sev: x.hard ? "bad" : "warn", title: `${x.added ? "Constraint added to" : "Constraint changed on"} ${x.code}`, body: `${x.name}: ${x.from} became ${x.to}.${x.hard ? " Hard constraints override logic, so the dates no longer come from the network." : ""}${at ? ` Removing it would move the finish ${Math.abs(at.days)} days ${at.days > 0 ? "later" : "earlier"}.` : ""}` });
  });
  c.remIncreases.forEach(x => out.push({ sev: x.drv ? "bad" : "warn", title: `Remaining duration grew on ${x.code}`, body: `${x.name} should have about ${x.expected} days left after this period. The update shows ${x.actual}.${x.drv ? " It is on the driving path." : ""}` }));
  c.drvIn.forEach(i => out.push({ sev: "warn", title: `${m.acts[i].code} moved onto the driving path`, body: `${m.acts[i].name} now drives the finish date. It did not in the previous update.` }));
  if (c.missed.length) out.push({ sev: "warn", title: `${c.missed.length} activit${c.missed.length > 1 ? "ies" : "y"} forecast to finish by now are still open`, body: c.missed.slice(0, 6).map(i => m.acts[i].code).join(", ") + "." });
  return out;
}

function vCompare() {
  const c = S.cmp, m = S.m;
  if (!c) return `<section class="panel"><h2>Compare two updates</h2>
    <p class="muted" style="max-width:70ch">Load last period's P6 export to see exactly what changed: which activities slipped, which logic was added or deleted, which durations were cut, which constraints appeared, and how much of the finish date movement comes from real progress rather than schedule edits.</p>

  const p = S.prev, evGain = S.ev.EV - p.ev.EV;
  const logicN = c.relAdded.length + c.relDeleted.length + c.relChanged.length;
  const changes = [
    ...c.durChanges.map(x => ({ type: "Original duration", i: x.i, code: x.code, name: x.name, before: x.from + " days", after: x.to + " days", fx: effectFor("duration", x.code) })),
    ...c.remIncreases.map(x => ({ type: "Remaining duration", i: x.i, code: x.code, name: x.name, before: x.expected + " days expected", after: x.actual + " days", fx: `<span class="muted">Moves with progress</span>` })),
    ...c.cstrChanges.map(x => ({ type: "Constraint", i: x.i, code: x.code, name: x.name, before: x.from, after: x.to, fx: effectFor("constraint", x.code) })),
    ...c.relDeleted.map(x => ({ type: "Logic deleted", i: (m.acts.find(a => a.code === x.predCode) || {}).i, code: x.predCode + " → " + x.succCode, name: "", before: x.type, after: "Removed", fx: effectFor("logic", x.predCode) })),
    ...c.relAdded.map(x => ({ type: "Logic added", i: x.succ, code: m.acts[x.pred].code + " → " + m.acts[x.succ].code, name: "", before: "None", after: x.type, fx: "" })),
    ...c.relChanged.map(x => ({ type: "Logic changed", i: x.succ, code: m.acts[x.pred].code + " → " + m.acts[x.succ].code, name: "", before: x.from, after: x.to, fx: "" })),
  ];
  const movers = c.rows.filter(r => r.cStatus !== "C" && r.delta !== 0).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta)).slice(0, 12);
  const chips = list => list.length ? `<div class="codes">${list.map(i => `<button data-act-open="${i}" title="${esc(m.acts[i].name)}">${esc(m.acts[i].code)}</button>`).join("")}</div>` : `<span class="muted">None</span>`;
  return `<section class="panel cmp-head">
      <div style="min-width:0"><div class="eyebrow">Update comparison</div><h2 class="num">${E.fmt(c.prevDate)} <span class="muted">→</span> ${E.fmt(c.curDate)}</h2>

      ${S.ev.BAC ? `<div class="kpi"><span class="eyebrow">Earned this period</span><span class="v num">${money(evGain)}</span><span class="d">SPI ${p.ev.SPI.toFixed(2)} → ${S.ev.SPI.toFixed(2)}</span></div>` : ""}
      <div class="kpi"><span class="eyebrow">Progress</span><span class="v num">${c.finished.length} · ${c.started.length}</span><span class="d">Finished · started this period</span></div>
      <div class="kpi"><span class="eyebrow">Logic changes</span><span class="v num ${logicN ? "tone-warn" : ""}">${logicN}</span><span class="d">${c.relAdded.length} added · ${c.relDeleted.length} deleted · ${c.relChanged.length} changed</span></div>
      <div class="kpi"><span class="eyebrow">Duration and constraint edits</span><span class="v num ${c.durChanges.length + c.cstrChanges.length ? "tone-warn" : ""}">${c.durChanges.length + c.cstrChanges.length}</span><span class="d">${c.durChanges.length} duration · ${c.cstrChanges.length} constraint</span></div>
    </section>
    <div class="grid g-main">
      <section class="panel"><div class="panel-h"><h2>What a reviewer should know</h2><span class="muted" style="font-size:.85rem">Found by comparing the two files</span></div>
        <div class="alerts">${c.findings.map(a => `<div class="alert"><span class="sev ${a.sev}"></span><div><b>${esc(a.title)}</b><p>${esc(a.body)}</p></div><span></span></div>`).join("")}</div></section>
      <section class="panel"><h2 style="margin-bottom:10px">Progress this period</h2>
        <h3 style="margin:6px 0 4px">Finished</h3>${chips(c.finished)}

        <h3 style="margin:14px 0 4px">Moved onto the driving path</h3>${chips(c.drvIn)}
        <h3 style="margin:14px 0 4px">Left the driving path</h3>${chips(c.drvOut)}

    </div>
    <section class="panel"><div class="panel-h"><h2>Logic, duration and constraint changes</h2><span class="muted" style="font-size:.85rem">Effect shows how the finish would move if the edit were reversed</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Change</th><th>Activity</th><th>Before</th><th>After</th><th>Effect on finish</th></tr></thead><tbody>
      ${changes.map(x => `<tr class="${x.i != null ? "click" : ""}" ${x.i != null ? `data-act-open="${x.i}"` : ""}><td><span class="chip ${/deleted|Original|Constraint/.test(x.type) ? "warn" : "neutral"}">${x.type}</span></td><td><span class="mono">${esc(x.code)}</span> ${esc(x.name)}</td><td>${esc(x.before)}</td><td>${esc(x.after)}</td><td>${x.fx}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">No logic, duration or constraint edits between these updates.</td></tr>`}
      </tbody></table></div></section>
    <section class="panel"><div class="panel-h"><h2>Biggest movers</h2><span class="muted" style="font-size:.85rem">Open activities whose forecast finish changed most</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Activity</th><th class="r">Previous finish</th><th class="r">Current finish</th><th class="r">Change</th><th class="r">Float</th><th>Driving</th></tr></thead><tbody>
      ${movers.map(r => `<tr class="click" data-act-open="${r.i}"><td><span class="mono">${esc(r.code)}</span> ${esc(r.name)}</td><td class="r">${E.fmt(r.pf, "short")}</td><td class="r">${E.fmt(r.cf, "short")}</td><td class="r ${r.delta > 0 ? "tone-bad" : "tone-good"}">${r.delta > 0 ? "+" : ""}${r.delta}d</td><td class="r">${r.ptf ?? ""} → <span class="${r.ctf < 0 ? "tone-bad" : ""}">${r.ctf ?? ""}</span></td><td>${r.cDrv ? `<span class="chip bad">${r.pDrv ? "Driving" : "New"}</span>` : r.pDrv ? `<span class="chip neutral">Left path</span>` : ""}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">No open activity changed its forecast finish.</td></tr>`}
      </tbody></table></div></section>`;
}

/* ---- recovery optimizer ---- */
function computeRecovery() {
  const f = S.d.finIdx != null ? S.m.acts[S.d.finIdx] : null;
  S.rec = E.recovery(S.m, S.s, { target: f && f.cstrDate != null ? f.i : null });
  S.recSel = new Set(S.rec.plan.map(o => o.id));
}
function recoveryResult(sel) {
  const m = S.m, s = S.s, r = S.rec, T = r.target;
  const s2 = sel.length ? E.applyPlan(m, sel) : s;
  const f0 = T != null ? E.finishDate(m, s, T) : E.projectFinishDate(m, s);
  const f1 = T != null ? E.finishDate(m, s2, T) : E.projectFinishDate(m, s2);
  const tgt = T != null ? m.acts[T] : null;
  return { f0, f1, gained: E.idx(f0) - E.idx(f1), cost: sel.reduce((a, o) => a + o.cost, 0), tgt, late0: tgt ? E.idx(f0) - E.idx(tgt.cstrDate) : null, late1: tgt ? E.idx(f1) - E.idx(tgt.cstrDate) : null, proj1: E.projectFinishDate(m, s2) };
}
function vRecover() {
  const r = S.rec, m = S.m;
  const sel = r.options.filter(o => S.recSel.has(o.id)), x = recoveryResult(sel);
  const head = x.tgt ? `Target: <b>${esc(x.tgt.name)}</b> by ${E.fmt(x.tgt.cstrDate)}. Current forecast ${E.fmt(x.f0)}${x.late0 > 0 ? `, <span class="tone-bad">${x.late0} working days late</span>` : `, ${-x.late0} working days to spare`}.` : `These options pull the project finish (${E.fmt(x.f0)}) earlier.`;
  const status = x.tgt ? (x.late1 <= 0 ? `<span class="chip good">${ICON.ok}Meets target</span>` : `<span class="chip bad">${ICON.x}${x.late1}d late</span>`) : "";
  return `<section class="panel cmp-head">
      <div style="min-width:0"><div class="eyebrow">Recovery optimizer</div><h2>Recovery plan</h2><p style="margin:4px 0 0;color:var(--ink-2)">${head}</p></div>
      <div class="actions"><button class="btn sm" data-act="rec-best">Use recommended plan</button><button class="btn sm ghost" data-act="rec-clear">Clear</button><button class="btn sm" data-act="dl-rec">${ICON.dl}Plan CSV</button></div>
    </section>
    <section class="kpis">
      <div class="kpi"><span class="eyebrow">${x.tgt ? esc(x.tgt.name) + " with plan" : "Finish with plan"}</span><span class="v num">${E.fmt(x.f1)}</span><span class="d">${status || "Project finish"}</span></div>
      <div class="kpi"><span class="eyebrow">Days recovered</span><span class="v num ${x.gained > 0 ? "tone-good" : ""}">${x.gained}</span><span class="d">Working days</span></div>
      <div class="kpi"><span class="eyebrow">Added cost</span><span class="v num">${money(x.cost)}</span><span class="d">${sel.length} action${sel.length === 1 ? "" : "s"} selected</span></div>
      <div class="kpi"><span class="eyebrow">Project finish</span><span class="v num">${E.fmt(x.proj1, "short")}</span><span class="d">Was ${E.fmt(E.projectFinishDate(m, S.s), "short")}</span></div>
    </section>
    <section class="panel"><div class="panel-h"><h2>Recovery options on the driving path</h2><span class="muted" style="font-size:.85rem">Tick options to build your plan. Days are what each option recovers on its own.</span></div>
      ${r.options.length ? `<div class="tbl-wrap"><table><thead><tr><th></th><th>Action</th><th>Type</th><th class="r">Days alone</th><th class="r">Est. cost</th><th>Risk to manage</th></tr></thead><tbody>
      ${r.options.map(o => `<tr class="${S.recSel.has(o.id) ? "sel" : ""}"><td><input type="checkbox" id="rec-${esc(o.id)}" data-rec="${esc(o.id)}" ${S.recSel.has(o.id) ? "checked" : ""} aria-label="Include in plan"></td>
        <td><label for="rec-${esc(o.id)}" style="cursor:pointer"><b style="font-weight:600">${esc(o.title)}</b>${o.recommended ? ` <span class="chip good">Recommended</span>` : ""}<div class="muted" style="font-size:.84rem">${esc(o.detail)}</div></label></td>
        <td><span class="chip ${o.kind === "Crash" ? "warn" : "neutral"}">${o.kind}</span></td><td class="r tone-good">${o.days}d</td><td class="r">${o.cost ? money(o.cost) : "$0"}</td><td style="font-size:.84rem;color:var(--ink-2);min-width:200px">${esc(o.risk)}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">No recovery options found. The driving path has no remaining activities long enough to compress or overlap.</p>`}
      <p class="muted" style="font-size:.8rem;margin:12px 0 0">Assumptions: crashing cuts remaining duration by 25% at a premium of 15% of the activity's remaining cost. Fast tracking starts the successor when half of the predecessor's remaining work is done. The recommended plan is the lowest cost set that meets the target, found by rescheduling the network for every combination tried.</p>
    </section>`;
}

/* ---- owner report ---- */
function staticCurve() {
  const pts = S.ev.series.points, W = 760, H = 260, P = { l: 58, r: 14, t: 14, b: 28 };
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, maxV = Math.max(...pts.map(p => Math.max(p.pv, p.ev || 0, p.ac || 0, p.fc || 0))) * 1.05;
  const X = t => P.l + (t - t0) / (t1 - t0) * (W - P.l - P.r), Y = v => H - P.b - v / maxV * (H - P.t - P.b);
  const step = maxV > 4e7 ? 1e7 : maxV > 2e7 ? 5e6 : maxV > 4e6 ? 1e6 : 2.5e5;
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="font:11px Arial,sans-serif">`;
  for (let v = 0; v <= maxV; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E2E6EC"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end" fill="#6B768C">${money(v).replace(".00M", "M")}</text>`;
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const d0 = new Date(t0); let mt = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1), k = 0;
  while (mt < t1) { const d = new Date(mt); if (k++ % 2 === 0) g += `<text x="${X(mt)}" y="${H - 8}" text-anchor="middle" fill="#6B768C">${MON[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}</text>`; mt = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); }
  const line = (key, col, dash) => { const p = pts.filter(q => q[key] != null); return p.length ? `<path d="${p.map((q, i) => (i ? "L" : "M") + X(q.t).toFixed(1) + " " + Y(q[key]).toFixed(1)).join("")}" fill="none" stroke="${col}" stroke-width="2" ${dash ? 'stroke-dasharray="5 4"' : ""}/>` : ""; };
  g += line("pv", "#2F6BD8") + line("fc", "#6B768C", true) + line("ac", "#E8641E") + line("ev", "#0E9384");
  const xd = X(S.m.dataDate);
  g += `<line x1="${xd}" x2="${xd}" y1="${P.t}" y2="${H - P.b}" stroke="#E8641E" stroke-dasharray="2 3"/><text x="${xd + 5}" y="${P.t + 10}" fill="#E8641E" font-weight="bold">Data date</text></svg>`;
  return g + `<div class="lg"><span><i style="background:#2F6BD8"></i>Planned value</span><span><i style="background:#0E9384"></i>Earned value</span><span><i style="background:#E8641E"></i>Actual cost</span><span><i style="background:#6B768C"></i>Forecast</span></div>`;
}
function ownerReport() {
  const m = S.m, s = S.s, ev = S.ev, d = S.d, f = facts(), logo = ($(".brand .logo") || {}).src || "";
  const narr = S.narrative && !/^_Drafting/.test(S.narrative) ? S.narrative : ruleNarrative();
  const sevC = { bad: "#C2272D", warn: "#9A6200", good: "#0F7B4F" };
  const kpi = (l, v, sub, c) => `<div class="k"><div class="l">${l}</div><div class="v" style="color:${c || "#121A26"}">${v}</div><div class="s">${sub}</div></div>`;
  const plan = S.rec.options.filter(o => S.recSel.has(o.id)), rx = recoveryResult(plan);
  const sec = (t, body) => `<section><h2>${t}</h2>${body}</section>`;
  const tbl = (head, rows) => `<table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
  let body = `<div class="kp">
    ${kpi("Forecast finish", E.fmt(f.fin), f.slip > 0 ? f.slip + " working days behind baseline" : "On baseline", f.slip > 0 ? "#C2272D" : "")}
    ${kpi("P80 finish", E.fmt(f.p80), "Risk adjusted, P50 " + E.fmt(f.p50, "short"))}
    ${kpi("Schedule health", d.passed + " of 14", "DCMA checks passing", d.passed < 10 ? "#C2272D" : "")}
    ${ev.BAC ? kpi("SPI · CPI", ev.SPI.toFixed(2) + " · " + ev.CPI.toFixed(2), "Earned " + pct1(100 * ev.EV / ev.BAC) + " of " + money(ev.BAC)) + kpi("Estimate at completion", money(ev.EAC_cpi), ev.VAC < 0 ? money(-ev.VAC) + " over budget" : money(ev.VAC) + " under budget", ev.VAC < 0 ? "#C2272D" : "") : ""}
  </div>`;
  body += sec("Needs attention", `<ul class="al">${alerts().map(a => `<li style="border-color:${sevC[a.sev]}"><b>${esc(a.title)}</b><br>${esc(a.body)}</li>`).join("")}</ul>`);
  if (ev.BAC) body += sec("Cumulative cost curve", staticCurve());
  body += sec("Status narrative", `<div class="doc">${md(narr)}</div>`);
  body += sec("Driving path to finish", tbl(["Activity", "Start", "Finish", "Float"], f.drivers.slice(0, 12).map(i => `<tr><td><b>${esc(m.acts[i].code)}</b> ${esc(m.acts[i].name)}</td><td>${E.fmt(E.startDate(m, s, i))}</td><td>${E.fmt(E.finishDate(m, s, i))}</td><td style="color:${s.TF[i] < 0 ? "#C2272D" : "inherit"}">${s.TF[i]}d</td></tr>`)));
  if (plan.length) body += sec("Recovery plan", `<p>${plan.length} actions recover <b>${rx.gained} working days</b> for an estimated <b>${money(rx.cost)}</b>${rx.tgt ? `, moving ${esc(rx.tgt.name.toLowerCase())} to ${E.fmt(rx.f1)} against a target of ${E.fmt(rx.tgt.cstrDate)}` : ""}.</p>` + tbl(["Action", "Type", "Days", "Cost"], plan.map(o => `<tr><td>${esc(o.title)}<br><span class="mu">${esc(o.detail)}</span></td><td>${o.kind}</td><td>${o.days}d</td><td>${o.cost ? money(o.cost) : "$0"}</td></tr>`)));
  body += sec("Schedule health (DCMA 14 point)", tbl(["Check", "Result", "Value", "Target"], d.checks.map(c => `<tr><td>${c.id}. ${esc(c.name)}</td><td style="color:${c.pass ? "#0F7B4F" : "#C2272D"};font-weight:bold">${c.pass ? "Pass" : "Fail"}</td><td>${typeof c.value === "string" ? c.value : c.unit === "%" ? pct1(c.value) : c.value.toFixed(2)}</td><td>${esc(c.threshold)}</td></tr>`)));
  body += sec("Risk outlook", `<p>Across ${S.mc.N.toLocaleString()} Monte Carlo runs the P50 finish is <b>${E.fmt(f.p50)}</b> and the P80 is <b>${E.fmt(f.p80)}</b>.${f.pOnTime != null ? ` The chance of meeting ${esc(f.fm.name.toLowerCase())} is <b>${Math.round(f.pOnTime * 100)}%</b>.` : ""}</p>` + (S.risks.filter(r => r.on).length ? tbl(["Risk event", "Activity", "Probability", "Delay"], S.risks.filter(r => r.on).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(m.acts[r.act].code)}</td><td>${Math.round(r.prob * 100)}%</td><td>${r.days}d</td></tr>`)) : ""));
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(m.title)} Project Controls Report ${E.fmt(m.dataDate, "iso")}</title>

async function submitDemo(form) {
  const st = $("#dm-status"), v = Object.fromEntries(new FormData(form).entries());

  if (DEMO_ENDPOINT) {

    try {
      const r = await fetch(DEMO_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(Object.assign({ source: "ControlPoint" }, v)) });
      if (!r.ok) throw new Error();

/* ---- schedule ---- */
function rowsFor(filter) {
  const m = S.m, s = S.s, q = S.q.trim().toLowerCase();
  const openEnds = new Set(S.d.checks[0].items);
  return m.acts.filter(a => {
    if (q && !(a.code + " " + a.name).toLowerCase().includes(q)) return false;
    if (filter === "crit") return a.status !== "C" && s.TF[a.i] <= 0;
    if (filter === "neg") return a.status !== "C" && s.TF[a.i] < 0;
    if (filter === "open") return openEnds.has(a.i);
    if (filter === "active") return a.status === "A";
    if (filter === "late") return a.blFinish != null && E.finishDate(m, s, a.i) > a.blFinish;
    return true;
  });
}
function vSchedule() {
  const F = [["all", "All"], ["crit", "Critical"], ["neg", "Negative float"], ["late", "Late vs baseline"], ["open", "Open ends"], ["active", "In progress"]];
  const rows = rowsFor(S.filter);
  return `<section class="toolbar">
      <div class="seg" role="group" aria-label="Filter">${F.map(([k, l]) => `<button data-filter-set="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join("")}</div>
      <input type="search" id="q" placeholder="Search code or name" value="${esc(S.q)}" aria-label="Search activities">
      <span class="muted" style="font-size:.85rem">${rows.length} shown</span>
    </section>
    <div class="legend"><span><i style="background:var(--bar)"></i>Forecast</span><span><i style="background:var(--crit)"></i>Critical</span><span><i style="background:var(--ink-3)"></i>Actual</span><span><i style="background:var(--bl);height:4px"></i>Baseline</span><span><i style="background:var(--accent);width:2px;height:12px"></i>Data date</span></div>
    <div class="gantt" id="gantt">${gantt(rows)}</div>
    <section class="panel"><div class="panel-h"><h2>Activity register</h2><button class="btn sm" data-act="dl-acts">${ICON.dl}CSV</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Activity</th><th>Status</th><th class="r">Rem dur</th><th class="r">Start</th><th class="r">Finish</th><th class="r">BL finish</th><th class="r">Var</th><th class="r">Float</th><th class="r">Budget</th></tr></thead><tbody>
    ${rows.map(a => { const s = S.s, m = S.m, fin = E.finishDate(m, s, a.i), v = a.blFinish != null ? E.idx(a.blFinish) - E.idx(fin) : null;
      return `<tr class="click" data-act-open="${a.i}"><td class="mono">${esc(a.code)}</td><td>${esc(a.name)}</td><td>${statusChip(a)}</td><td class="r">${a.mile ? "" : a.remDur + "d"}</td><td class="r">${E.fmt(E.startDate(m, s, a.i), "short")}</td><td class="r">${E.fmt(fin, "short")}</td><td class="r muted">${E.fmt(a.blFinish, "short")}</td><td class="r ${v < 0 ? "tone-bad" : ""}">${v == null ? "" : v}</td><td class="r ${s.TF[a.i] < 0 ? "tone-bad" : s.TF[a.i] === 0 ? "tone-warn" : ""}">${s.TF[a.i] == null ? "" : s.TF[a.i] + "d"}</td><td class="r">${a.bac ? money(a.bac) : ""}</td></tr>`; }).join("")}
    </tbody></table></div></section>`;
}
function statusChip(a) {
  return a.status === "C" ? `<span class="chip neutral">Complete</span>` : a.status === "A" ? `<span class="chip warn">${a.pct}%</span>` : `<span class="chip neutral" style="background:transparent;border:1px solid var(--line-2)">Not started</span>`;
}
function gantt(rows) {
  const m = S.m, s = S.s;
  if (!rows.length) return `<p class="muted" style="padding:16px">No activities match this filter.</p>`;
  const LW = 300, RH = 24, HH = 40;
  const starts = rows.map(a => Math.min(a.blStart || Infinity, E.startDate(m, s, a.i)));
  const ends = rows.map(a => Math.max(a.blFinish || 0, E.finishDate(m, s, a.i)));
  const t0 = Math.min(...starts) - 7 * E.DAY, t1 = Math.max(...ends, m.dataDate) + 14 * E.DAY;
  const pxd = 2.1, W = LW + (t1 - t0) / E.DAY * pxd, H = HH + rows.length * RH + 6;
  const X = t => LW + (t - t0) / E.DAY * pxd;
  let g = `<svg width="${Math.ceil(W)}" height="${H}" role="img" aria-label="Gantt chart">`;
  // month grid
  const d0 = new Date(t0); let mt = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), 1);
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  while (mt < t1) { const x = X(mt), d = new Date(mt);
    if (x > LW) g += `<line x1="${x}" x2="${x}" y1="${HH - 14}" y2="${H}" stroke="var(--line)"/>`;
    const nx = X(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
    if (nx - Math.max(x, LW) > 30) g += `<text x="${Math.max(x, LW) + 5}" y="${HH - 18}" font-size="11" style="fill:var(--ink-3)">${MON[d.getUTCMonth()]}${d.getUTCMonth() === 0 || x <= LW + 1 ? " " + d.getUTCFullYear() : ""}</text>`;
    mt = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); }
  g += `<rect x="0" y="0" width="${LW}" height="${H}" fill="var(--surface)"/><line x1="${LW}" x2="${LW}" y1="0" y2="${H}" stroke="var(--line-2)"/>`;
  g += `<text x="12" y="${HH - 18}" font-size="10.5" font-weight="600" letter-spacing=".07em" style="fill:var(--ink-3)">ACTIVITY</text><line x1="0" x2="${W}" y1="${HH - 6}" y2="${HH - 6}" stroke="var(--line-2)"/>`;
  rows.forEach((a, k) => {
    const y = HH + k * RH, cy = y + RH / 2, crit = a.status !== "C" && s.TF[a.i] <= 0;
    g += `<g class="grow" data-act-open="${a.i}" style="cursor:pointer"><rect x="0" y="${y}" width="${W}" height="${RH}" fill="transparent"/>`;
    g += `<text x="12" y="${cy + 4}" font-size="12"><tspan font-family="IBM Plex Mono, monospace" font-size="10.5" style="fill:var(--ink-3)">${esc(a.code)}</tspan><tspan dx="8">${esc(a.name.length > 32 ? a.name.slice(0, 31) + "…" : a.name)}</tspan></text>`;
    if (a.blStart != null && a.blFinish != null) g += a.mile ? "" : `<rect x="${X(a.blStart)}" y="${cy + 5}" width="${Math.max(2, X(a.blFinish + E.DAY) - X(a.blStart))}" height="3" rx="1.5" fill="var(--bl)"/>`;
    const st = E.startDate(m, s, a.i), fi = E.finishDate(m, s, a.i);
    if (a.mile) {
      const x = X(a.finMile ? fi + E.DAY : st), c = a.status === "C" ? "var(--ink-3)" : crit ? "var(--crit)" : "var(--bar)";
      g += `<path d="M${x} ${cy - 6} l6 6 l-6 6 l-6 -6z" fill="${c}"/>`;
    } else {
      const x1 = X(st), x2 = X(fi + E.DAY);
      if (a.status === "C") g += `<rect x="${x1}" y="${cy - 6}" width="${Math.max(2, x2 - x1)}" height="10" rx="2" fill="var(--ink-3)"/>`;
      else if (a.status === "A") { const xd = X(m.dataDate);
        g += `<rect x="${x1}" y="${cy - 6}" width="${Math.max(2, xd - x1)}" height="10" rx="2" fill="var(--ink-3)"/><rect x="${xd}" y="${cy - 6}" width="${Math.max(2, x2 - xd)}" height="10" rx="2" fill="${crit ? "var(--crit)" : "var(--bar)"}"/>`; }
      else g += `<rect x="${x1}" y="${cy - 6}" width="${Math.max(2, x2 - x1)}" height="10" rx="2" fill="${crit ? "var(--crit)" : "var(--bar)"}"/>`;
      if (a.status !== "C" && s.TF[a.i] != null) g += `<text x="${x2 + 5}" y="${cy + 3}" font-size="10" style="fill:${s.TF[a.i] < 0 ? "var(--bad)" : "var(--ink-3)"}">${s.TF[a.i]}d</text>`;
    }
    g += `</g>`;
  });
  const xd = X(m.dataDate);
  g += `<line x1="${xd}" x2="${xd}" y1="${HH - 14}" y2="${H}" stroke="var(--accent)" stroke-width="2"/><text x="${xd + 4}" y="${HH - 4}" font-size="10" font-weight="600" style="fill:var(--accent)">DATA DATE</text>`;
  return g + `</svg>`;
}

function whatIf() {
  const m = S.m, s = S.s;
  if (S.whatIf.act == null) { const d = [...s.driving].filter(i => !m.acts[i].mile && m.acts[i].status !== "C").sort((a, b) => s.ES[a] - s.ES[b]); S.whatIf.act = d[0] ?? m.acts.find(a => a.status !== "C")?.i; }
  if (S.whatIf.act == null) return "";
  const extra = new Float64Array(m.acts.length); extra[S.whatIf.act] = +S.whatIf.days || 0;
  const s2 = E.schedule(m, extra);
  const moved = m.acts.filter(a => a.status !== "C" && Math.round(E.finishDate(m, s2, a.i) - E.finishDate(m, s, a.i)) !== 0);
  const miles = m.acts.filter(a => a.mile && a.status !== "C");
  const fin0 = E.projectFinishDate(m, s), fin1 = E.projectFinishDate(m, s2), dw = E.idx(fin1) - E.idx(fin0);
  const a = m.acts[S.whatIf.act];
  return `<p style="margin:0 0 10px"><b>${esc(a.code)} ${esc(a.name)}</b> has ${s.TF[a.i]} days of float. A ${S.whatIf.days} day delay moves the project finish <b class="${dw > 0 ? "tone-bad" : ""}">${dw} working days</b> to ${E.fmt(fin1)} and shifts ${moved.length} activities.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Milestone</th><th class="r">Now</th><th class="r">With delay</th><th class="r">Change</th><th class="r">Float after</th></tr></thead><tbody>
  ${miles.map(x => { const f0 = E.finishDate(m, s, x.i), f1 = E.finishDate(m, s2, x.i), c = E.idx(f1) - E.idx(f0); return `<tr><td>${esc(x.name)}</td><td class="r">${E.fmt(f0, "short")}</td><td class="r">${E.fmt(f1, "short")}</td><td class="r ${c > 0 ? "tone-bad" : ""}">${c > 0 ? "+" : ""}${c}d</td><td class="r ${s2.TF[x.i] < 0 ? "tone-bad" : ""}">${s2.TF[x.i]}d</td></tr>`; }).join("")}
  </tbody></table></div>`;
}
