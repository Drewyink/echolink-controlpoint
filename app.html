<title>Echolink ControlPoint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of workspaces, one scrolling work surface; collapses to a top tab strip on phones */
:root {
  --bg: #F1F4F9; --surface: #FFFFFF; --sunk: #EBEEF3; --line: #D9DEE6; --line-2: #C3CAD5;
  --ink: #121A26; --ink-2: #44506A; --ink-3: #6B768C;
  --accent: #D9581A; --accent-ink: #FFFFFF; --accent-soft: #FCE9DD;
  --rail: #121A26; --rail-ink: #C9D1DE; --rail-active: #FFFFFF;
  --good: #0F7B4F; --good-soft: #DFF3E9; --warn: #9A6200; --warn-soft: #FBF0D6; --bad: #C2272D; --bad-soft: #FBE3E3;
  --s-pv: #2F6BD8; --s-ev: #0E9384; --s-ac: #E8641E; --s-fc: #6B768C; --bl: #B9C1CE; --crit: #C2272D; --bar: #2F6BD8;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
  --glow-a: rgba(47,107,216,0.20); --glow-b: rgba(232,100,30,0.14); --glow-c: rgba(14,147,132,0.10); --gridline: rgba(30,55,100,0.07); --bg-top: #E3EAF6;
  --panel-shadow: 0 1px 2px rgba(16,30,60,0.05), 0 8px 24px rgba(16,30,60,0.06);
  --hero-bg: #0B1322; --hero-ink: #F2F5FA; --hero-ink-2: #A9B5C9; --hero-line: rgba(255,255,255,0.10); --hero-card: rgba(255,255,255,0.05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A0F18; --surface: #131A26; --sunk: #1B2330; --line: #283244; --line-2: #36425A;
  --ink: #E7ECF3; --ink-2: #B0BACB; --ink-3: #8592A8;
  --accent: #EF7A3C; --accent-ink: #1A0D05; --accent-soft: #3A2215;
  --rail: #070B12; --rail-ink: #93A0B5; --rail-active: #FFFFFF;
  --good: #3CC48A; --good-soft: #12301F; --warn: #E4AE45; --warn-soft: #33270E; --bad: #F06A6E; --bad-soft: #3A1719;
  --s-pv: #5A8CEB; --s-ev: #16A08C; --s-ac: #E3692A; --s-fc: #8592A8; --bl: #3E4A60; --crit: #F06A6E; --bar: #5A8CEB;
  --glow-a: rgba(90,140,235,0.22); --glow-b: rgba(239,122,60,0.16); --glow-c: rgba(22,160,140,0.12); --gridline: rgba(160,190,240,0.05); --bg-top: #101A2C;
  --panel-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A0F18; --surface: #131A26; --sunk: #1B2330; --line: #283244; --line-2: #36425A;
  --ink: #E7ECF3; --ink-2: #B0BACB; --ink-3: #8592A8;
  --accent: #EF7A3C; --accent-ink: #1A0D05; --accent-soft: #3A2215;
  --rail: #070B12; --rail-ink: #93A0B5; --rail-active: #FFFFFF;
  --good: #3CC48A; --good-soft: #12301F; --warn: #E4AE45; --warn-soft: #33270E; --bad: #F06A6E; --bad-soft: #3A1719;
  --s-pv: #5A8CEB; --s-ev: #16A08C; --s-ac: #E3692A; --s-fc: #8592A8; --bl: #3E4A60; --crit: #F06A6E; --bar: #5A8CEB;
  --glow-a: rgba(90,140,235,0.22); --glow-b: rgba(239,122,60,0.16); --glow-c: rgba(22,160,140,0.12); --gridline: rgba(160,190,240,0.05); --bg-top: #101A2C;
  --panel-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.25);
  color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background:
    radial-gradient(1100px 620px at 92% -8%, var(--glow-a), transparent 62%),
    radial-gradient(820px 520px at 18% -6%, var(--glow-b), transparent 58%),
    radial-gradient(900px 700px at 60% 110%, var(--glow-c), transparent 60%),
    linear-gradient(180deg, var(--bg-top) 0, var(--bg) 560px);
  background-color: var(--bg); background-attachment: fixed; color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 0.86em; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.15; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
.eyebrow { font: 600 0.72rem/1.2 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
/* rail */
.rail { background: linear-gradient(180deg, #0B1322 0%, #0E1729 55%, #121A2B 100%); color: var(--rail-ink); padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; flex-direction: column; gap: 10px; padding: 4px 4px 0; }
.brand .logo { display: block; width: 100%; max-width: 184px; height: auto; }
.brand .product { font: 600 0.78rem/1 var(--f-body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--rail-active); padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.12); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 5px; font-weight: 500; color: var(--rail-ink); }
.nav button:hover { background: rgba(255,255,255,0.06); color: var(--rail-active); }
.nav button[aria-current="page"] { background: rgba(232,100,30,0.16); color: var(--rail-active); box-shadow: inset 2px 0 0 #E8641E; }
.nav button:focus-visible { outline: 2px solid #E8641E; }
.nav .cnt { font: 500 0.72rem var(--f-mono); padding: 1px 6px; border-radius: 99px; background: rgba(255,255,255,0.08); }
.nav .cnt.bad { background: rgba(240,106,110,0.22); color: #FFB3B5; }
.rail-foot { margin-top: auto; font-size: 0.75rem; line-height: 1.45; }
.rail-foot a { color: var(--rail-active); }
/* main */
.main { position: relative; isolation: isolate; min-width: 0; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
  background-size: 44px 44px; -webkit-mask-image: linear-gradient(180deg, #000 0, rgba(0,0,0,.6) 380px, transparent 900px); mask-image: linear-gradient(180deg, #000 0, rgba(0,0,0,.6) 380px, transparent 900px); }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.topbar .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 0.88rem; margin-top: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; box-shadow: var(--panel-shadow); }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
@media (max-width: 980px) { .g-main { grid-template-columns: minmax(0, 1fr); } }
/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; box-shadow: var(--panel-shadow); }
.panel .kpis { box-shadow: none; }
.kpi { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi .v { font: 600 1.7rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 0.82rem; color: var(--ink-2); }
.tone-bad { color: var(--bad); } .tone-good { color: var(--good); } .tone-warn { color: var(--warn); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.neutral { background: var(--sunk); color: var(--ink-2); }
.chip svg { width: 11px; height: 11px; }
/* attention list */
.alerts { display: flex; flex-direction: column; }
.alert { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: start; }
.alert:first-child { border-top: 0; }
.alert .sev { align-self: stretch; border-radius: 2px; }
.alert .sev.bad { background: var(--bad); } .alert .sev.warn { background: var(--warn); } .alert .sev.good { background: var(--good); }
.alert b { font-weight: 600; }
.alert p { margin: 2px 0 0; color: var(--ink-2); font-size: 0.88rem; }
/* tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th { text-align: left; font: 600 0.7rem/1.2 var(--f-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--sunk); }
tr.sel { background: var(--accent-soft) !important; }
/* toolbar */
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 5px 11px; font-size: 0.84rem; font-weight: 500; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
input[type=search], input[type=number], input[type=text], select, textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 6px 9px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
/* gantt */
.gantt { overflow: auto; max-height: 640px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.gantt svg { display: block; }
.gantt text { font-family: var(--f-body); fill: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
/* health */
.score { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ring { width: 92px; height: 92px; flex: none; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
.check { box-shadow: var(--panel-shadow); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 13px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.check.fail { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.check .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.check .val { font: 600 1.35rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.check .thr { font-size: 0.78rem; color: var(--ink-3); }
.check p { margin: 0; font-size: 0.85rem; color: var(--ink-2); }
.check details summary { cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); }
.codes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.codes button { all: unset; cursor: pointer; font: 500 0.75rem var(--f-mono); padding: 1px 6px; border-radius: 4px; background: var(--sunk); }
.codes button:hover { background: var(--accent-soft); }
.bar-meter { height: 6px; border-radius: 3px; background: var(--sunk); position: relative; overflow: hidden; }
.bar-meter span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--f-body); font-size: 11px; fill: var(--ink-3); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 6px; font-size: 0.8rem; line-height: 1.45; white-space: nowrap; z-index: 5; transform: translate(-50%, calc(-100% - 10px)); }
.tip[hidden] { display: none; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(10,15,25,0.18); z-index: 30; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-h { display: flex; justify-content: space-between; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer-b { overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 0.88rem; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
/* assistant */
.chat { display: flex; flex-direction: column; gap: 14px; min-height: 360px; }
.msg { max-width: 760px; }
.msg.user { align-self: flex-end; background: var(--sunk); padding: 9px 13px; border-radius: 10px 10px 2px 10px; }
.msg.ai { border-left: 2px solid var(--accent); padding: 2px 0 2px 14px; }
.msg.ai h4 { font: 600 1rem var(--f-display); margin: 10px 0 4px; }
.msg.ai p { margin: 6px 0; } .msg.ai ul { margin: 6px 0; padding-left: 20px; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 200px; }
.prompts { display: flex; flex-wrap: wrap; gap: 6px; }
.prompts button { all: unset; cursor: pointer; font-size: 0.84rem; padding: 5px 11px; border: 1px solid var(--line-2); border-radius: 99px; color: var(--ink-2); }
.prompts button:hover { border-color: var(--accent); color: var(--ink); }
.prompts button:focus-visible { outline: 2px solid var(--accent); }
.doc { max-width: 72ch; font-size: 0.95rem; }
.doc h4 { font: 600 1.05rem var(--f-display); margin: 18px 0 4px; }
.doc p { margin: 6px 0; } .doc ul { margin: 6px 0; padding-left: 20px; }
.note { font-size: 0.84rem; color: var(--ink-2); background: var(--sunk); border-radius: 6px; padding: 9px 12px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 8px; padding: 16px; text-align: center; color: var(--ink-2); font-size: 0.9rem; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.range { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.range label { display: flex; flex-direction: column; gap: 3px; font-size: 0.8rem; color: var(--ink-3); }
.range input { width: 92px; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 6px; font-size: 0.88rem; z-index: 40; }
.skeleton { color: var(--ink-3); font-style: italic; }
/* welcome */
.hero { position: relative; overflow: hidden; border-radius: 14px; background:
    radial-gradient(700px 380px at 88% 0%, rgba(90,140,235,0.32), transparent 65%),
    radial-gradient(520px 340px at 0% 100%, rgba(232,100,30,0.28), transparent 62%),
    linear-gradient(135deg, #0B1322 0%, #0F1B33 60%, #101A2C 100%);
  color: var(--hero-ink); padding: clamp(24px, 4vw, 48px); display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 0.85fr); gap: 36px; align-items: center; box-shadow: 0 20px 50px rgba(8,16,32,0.25); }
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 36px 36px; -webkit-mask-image: radial-gradient(ellipse at 70% 30%, #000 0, transparent 70%); mask-image: radial-gradient(ellipse at 70% 30%, #000 0, transparent 70%); }
.hero > * { position: relative; }
.hero .eyebrow { color: #F2884A; }
.hero h1 { font-size: clamp(1.9rem, 3.6vw, 2.9rem); line-height: 1.05; margin: 10px 0 16px; color: var(--hero-ink); }
.hero h1 em { font-style: normal; color: #F2884A; }
.hero p.lede { font-size: 1.06rem; line-height: 1.6; color: var(--hero-ink-2); max-width: 60ch; margin: 0 0 22px; }
.hero .btn { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.22); color: var(--hero-ink); }
.hero .btn:hover { border-color: rgba(255,255,255,0.5); }
.hero .btn.primary { background: #E8641E; border-color: #E8641E; color: #fff; }
.hero .fine { font-size: 0.82rem; color: var(--hero-ink-2); margin-top: 14px; display: flex; align-items: center; gap: 7px; }
.hero .fine svg { width: 14px; height: 14px; flex: none; color: #3CC48A; }
.readout { background: var(--hero-card); border: 1px solid var(--hero-line); border-radius: 12px; padding: 18px; backdrop-filter: blur(6px); }
.readout .rh { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 0.8rem; color: var(--hero-ink-2); }
.readout .live { display: inline-flex; align-items: center; gap: 6px; color: #7FE0C8; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: .7rem; }
.readout .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3CC48A; box-shadow: 0 0 0 3px rgba(60,196,138,0.25); }
.readout .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hero-line); }
.readout .row span { color: var(--hero-ink-2); font-size: 0.86rem; }
.readout .row b { font: 600 1.25rem/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--hero-ink); }
.readout .row b.bad { color: #FF8D90; } .readout .row b.warn { color: #F2C46B; }
.readout svg { display: block; width: 100%; height: 54px; margin-top: 6px; }
.feat { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.feat button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--panel-shadow); transition: border-color .15s, transform .15s; }
.feat button:hover { border-color: var(--accent); transform: translateY(-1px); }
.feat button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.feat .ic { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.feat .ic svg { width: 18px; height: 18px; }
.feat h3 { margin-top: 4px; }
.feat p { margin: 0; color: var(--ink-2); font-size: 0.9rem; }
.feat .go { margin-top: auto; padding-top: 6px; font-size: 0.82rem; font-weight: 600; color: var(--accent); }

<script>
const SAMPLE_XER = /*SAMPLE*/;
const E = window.PCEngine;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => { const a = Math.abs(v), s = v < 0 ? "−" : ""; return a >= 1e6 ? s + "$" + (a / 1e6).toFixed(2) + "M" : a >= 1e3 ? s + "$" + (a / 1e3).toFixed(0) + "K" : s + "$" + a.toFixed(0); };
const pct1 = v => v.toFixed(1) + "%";
const ICON = {
  up: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>',
  down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg>',
  ok: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 8.5 3.2 3L13 4.5"/></svg>',
  x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m4 4 8 8M12 4l-8 8"/></svg>',
  warn: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4v5M8 11.5v.5"/></svg>',
  upload: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 10.5v3h11v-3"/></svg>',
  dl: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2.5V11M4.5 7.5 8 11l3.5-3.5M2.5 13.5h11"/></svg>',
  spark: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5 9.4 6.6 14.5 8 9.4 9.4 8 14.5 6.6 9.4 1.5 8l5.1-1.4z"/></svg>',
};

/* ---------------- state ---------------- */
const S = { view: "overview", source: "", tables: null, projects: [], projId: null, m: null, s: null, d: null, ev: null, mc: null,
  filter: "all", q: "", risks: [], mcOpts: { iterations: 1000, low: 0.9, likely: 1.0, high: 1.3 }, whatIf: { act: null, days: 10 },
  chat: [], busy: false, narrative: null, narrativeSource: "", caps: { sample: null, downloads: null } };
S.view = "welcome";
try { if (localStorage.getItem("cp.skipWelcome") === "1") { S.view = localStorage.getItem("cp.view") || "overview"; if (S.view === "welcome") S.view = "overview"; } } catch (e) {}

/* AI: runs when the hosting environment provides an AI capability, or on your own site when CONTROLPOINT_CONFIG.aiEndpoint points at a server that calls an LLM.
   The endpoint receives POST {messages:[{role,content}]} and returns {text}. */
const AI_ENDPOINT = (window.CONTROLPOINT_CONFIG && window.CONTROLPOINT_CONFIG.aiEndpoint) || "";
const aiOn = () => !!(S.caps.sample || AI_ENDPOINT);
async function aiCall(input, opts) {
  opts = opts || {};
  if (S.caps.sample) return S.caps.sample(input, opts);
  const messages = typeof input === "string" ? [{ role: "user", content: input }] : input;
  let r;
  try { r = await fetch(AI_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages }), signal: opts.signal }); }
  catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network" }; }
  if (!r.ok) throw { code: r.status === 429 ? "rate_limited" : "server_error" };
  const j = await r.json(), text = j.text || "";
  if (opts.onText) opts.onText({ text });
  return { text };
}
const VIEWS = [
  ["welcome", "Welcome"], ["overview", "Command center"], ["schedule", "Schedule"], ["health", "Health check"],
  ["cost", "Cost & EVM"], ["risk", "Risk & what if"], ["assistant", "AI analyst"], ["data", "Data & exports"]
];

function load(text, source) {
  const t = E.parseXER(text);
  const taskProj = new Set(t.TASK.map(r => r.proj_id));
  S.projects = (t.PROJECT || []).filter(p => taskProj.has(p.proj_id));
  if (!S.projects.length) S.projects = [{ proj_id: t.TASK[0].proj_id, proj_short_name: "Project" }];
  S.tables = t; S.source = source;
  selectProject(S.projects[0].proj_id);
}
function selectProject(id) {
  S.projId = id;
  const p = S.projects.find(x => x.proj_id === id) || {};
  S.tables.PROJECT = [p].concat((S.tables.PROJECT || []).filter(x => x !== p));
  S.m = E.buildModel(S.tables, { projId: id });
  if (S.source === "sample") { S.m.title = "Northgate Distribution Center"; }
  S.risks = S.source === "sample" ? defaultRisks(S.m) : [];
  S.chat = []; S.narrative = null; S.whatIf.act = null;
  recompute();
}
function defaultRisks(m) {
  const at = c => (m.acts.find(a => a.code === c) || {}).i;
  return [
    { name: "Conveyor vendor delivers sortation modules late", act: at("A7030"), prob: 0.35, days: 15, on: true },
    { name: "Wet weather stalls roofing", act: at("A5010"), prob: 0.4, days: 8, on: true },
    { name: "Utility energization inspection backlog", act: at("A6010"), prob: 0.3, days: 12, on: true },
    { name: "WMS to Dynamics 365 interface defects found in testing", act: at("A8050"), prob: 0.5, days: 10, on: true },
  ].filter(r => r.act != null);
}
function recompute() {
  S.s = E.schedule(S.m);
  S.d = E.dcma(S.m, S.s);
  S.ev = E.evm(S.m, S.s);
  S.mc = E.monteCarlo(S.m, Object.assign({}, S.mcOpts, { risks: S.risks }));
  render();
}

/* ---------------- derived facts ---------------- */
function facts() {
  const m = S.m, s = S.s, ev = S.ev, d = S.d;
  const fin = E.projectFinishDate(m, s);
  const blFin = ev.blFinish;
  const slip = E.idx(fin) - E.idx(blFin);
  const fm = d.finIdx != null ? m.acts[d.finIdx] : null;
  const fmTF = fm ? s.TF[fm.i] : null;
  const inc = m.acts.filter(a => a.status !== "C");
  const neg = inc.filter(a => s.TF[a.i] < 0).length;
  const crit = inc.filter(a => s.TF[a.i] <= 0).length;
  const drivers = [...s.driving].filter(i => m.acts[i].status !== "C").sort((a, b) => s.ES[a] - s.ES[b]);
  const done = m.acts.filter(a => a.status === "C").length, active = m.acts.filter(a => a.status === "A").length;
  const pctDone = ev.BAC ? 100 * ev.EV / ev.BAC : 0;
  const p50 = E.dateOf(S.mc.P50 - 1), p80 = E.dateOf(S.mc.P80 - 1);
  const pOnTime = fm && fm.cstrDate ? S.mc.finishes.filter(f => f <= E.idx(fm.cstrDate) + 1 + (s.PF - s.EF[fm.i])).length / S.mc.N : null;
  return { fin, blFin, slip, fm, fmTF, neg, crit, drivers, done, active, inc: inc.length, pctDone, p50, p80, pOnTime };
}
function alerts() {
  const m = S.m, s = S.s, ev = S.ev, d = S.d, f = facts(), out = [];
  if (f.fm && f.fmTF < 0) out.push({ sev: "bad", title: `${f.fm.name} forecast misses its target by ${-f.fmTF} working days`, body: `Target ${E.fmt(f.fm.cstrDate)}, forecast ${E.fmt(E.finishDate(m, s, f.fm.i))}. ${f.neg} activities now carry negative float.`, go: "schedule", filter: "neg" });
  else if (f.slip > 0) out.push({ sev: "warn", title: `Forecast finish is ${f.slip} working days behind baseline`, body: `Baseline ${E.fmt(f.blFin)}, forecast ${E.fmt(f.fin)}.`, go: "schedule", filter: "crit" });
  if (ev.BAC && ev.SPI < 0.95) out.push({ sev: ev.SPI < 0.9 ? "bad" : "warn", title: `Schedule performance is at ${ev.SPI.toFixed(2)} SPI`, body: `${money(-ev.SV)} of planned work has not been earned. Earned schedule puts the team ${Math.round((m.dataDate - ev.esDate) / E.DAY)} calendar days behind plan.`, go: "cost" });
  if (ev.BAC && ev.CPI < 0.98) out.push({ sev: ev.CPI < 0.93 ? "bad" : "warn", title: `Cost efficiency is ${ev.CPI.toFixed(2)} CPI`, body: `Estimate at completion by CPI is ${money(ev.EAC_cpi)}, a ${money(-ev.VAC)} overrun on a ${money(ev.BAC)} budget. To finish on budget the remaining work must run at ${ev.TCPI.toFixed(2)} TCPI.`, go: "cost" });
  const ov = s.overrides[0];
  if (ov) out.push({ sev: "bad", title: `${m.acts[ov.i].code} has a mandatory constraint that overrides logic`, body: `${m.acts[ov.i].name} is forced to start ${ov.logic - ov.forced} working days before its predecessors allow. The forecast for this work is not credible until the constraint is reviewed.`, go: "health" });
  const fails = d.checks.filter(c => !c.pass).map(c => c.name);
  if (fails.length) out.push({ sev: fails.length > 5 ? "bad" : "warn", title: `${fails.length} of 14 DCMA checks fail`, body: fails.slice(0, 6).join(", ") + (fails.length > 6 ? " and more" : "") + ".", go: "health" });
  if (f.pOnTime != null) out.push({ sev: f.pOnTime < 0.5 ? "bad" : f.pOnTime < 0.8 ? "warn" : "good", title: `${Math.round(f.pOnTime * 100)}% chance of meeting ${f.fm.name.toLowerCase()}`, body: `Monte Carlo P50 ${E.fmt(f.p50)}, P80 ${E.fmt(f.p80)} across ${S.mc.N.toLocaleString()} runs.`, go: "risk" });
  return out;
}

/* ---------------- render ---------------- */
function render() {
  try { localStorage.setItem("cp.view", S.view); } catch (e) {}
  const fails = S.d ? S.d.checks.filter(c => !c.pass).length : 0;
  $("#nav").innerHTML = VIEWS.map(([k, l]) => [k, k === "assistant" && !aiOn() ? "Status narrative" : l]).map(([k, l]) => `<button data-view="${k}" ${S.view === k ? 'aria-current="page"' : ""}>${l}${k === "health" && S.d ? `<span class="cnt ${fails ? "bad" : ""}">${14 - fails}/14</span>` : ""}</button>`).join("");
  const R = $("#root");
  R.innerHTML = (S.view === "welcome" ? "" : topbar()) + ({ welcome: vWelcome, overview: vOverview, schedule: vSchedule, health: vHealth, cost: vCost, risk: vRisk, assistant: vAssistant, data: vData }[S.view] || vOverview)();
  R.classList.remove("fade"); void R.offsetWidth; R.classList.add("fade");
  afterRender();
}
function topbar() {
  const m = S.m, f = facts();
  const projSel = S.projects.length > 1 ? `<select id="proj" aria-label="Project">${S.projects.map(p => `<option value="${esc(p.proj_id)}" ${p.proj_id === S.projId ? "selected" : ""}>${esc(p.proj_short_name)}</option>`).join("")}</select>` : "";
  return `<header class="topbar">
    <div style="min-width:0">
      <div class="eyebrow">${S.source === "sample" ? "Sample project · NDC-2026" : "Loaded from " + esc(S.source)}</div>
      <h1>${esc(m.title)}</h1>
      <div class="meta"><span>Data date <b class="num">${E.fmt(m.dataDate)}</b></span><span>${m.acts.length} activities · ${m.rels.length} relationships</span><span>${f.done} complete · ${f.active} in progress</span></div>
    </div>
    <div class="actions">${projSel}
      <button class="btn" data-act="upload">${ICON.upload}Load P6 XER</button>
      ${S.source !== "sample" ? `<button class="btn ghost" data-act="sample">Use sample</button>` : ""}
    </div>
  </header>`;
}

function kpiStrip() {
  const f = facts(), ev = S.ev, d = S.d;
  const slipTone = f.slip > 0 ? "tone-bad" : "tone-good";
  return `<section class="kpis" aria-label="Key indicators">
    <div class="kpi"><span class="eyebrow">Forecast finish</span><span class="v num">${E.fmt(f.fin)}</span><span class="d ${slipTone}">${f.slip > 0 ? f.slip + " working days late" : f.slip < 0 ? -f.slip + " working days early" : "On baseline"} vs ${E.fmt(f.blFin, "short")}</span></div>
    <div class="kpi"><span class="eyebrow">P80 finish</span><span class="v num">${E.fmt(f.p80)}</span><span class="d">Risk adjusted · P50 ${E.fmt(f.p50, "short")}</span></div>
    <div class="kpi"><span class="eyebrow">Schedule health</span><span class="v num ${d.passed < 10 ? "tone-bad" : d.passed < 13 ? "tone-warn" : "tone-good"}">${d.passed}/14</span><span class="d">DCMA checks passing</span></div>
    ${ev.BAC ? `<div class="kpi"><span class="eyebrow">SPI · CPI</span><span class="v num"><span class="${ev.SPI < 0.95 ? "tone-bad" : "tone-good"}">${ev.SPI.toFixed(2)}</span> · <span class="${ev.CPI < 0.95 ? "tone-bad" : ev.CPI < 1 ? "tone-warn" : "tone-good"}">${ev.CPI.toFixed(2)}</span></span><span class="d">Earned ${pct1(f.pctDone)} of ${money(ev.BAC)}</span></div>
    <div class="kpi"><span class="eyebrow">Estimate at completion</span><span class="v num ${ev.VAC < 0 ? "tone-bad" : "tone-good"}">${money(ev.EAC_cpi)}</span><span class="d">${ev.VAC < 0 ? money(-ev.VAC) + " over budget" : money(ev.VAC) + " under budget"} (CPI method)</span></div>` : `<div class="kpi"><span class="eyebrow">Cost data</span><span class="v">None</span><span class="d">No resource costs in this file</span></div>`}
  </section>`;
}

function vOverview() {
  const m = S.m, s = S.s, f = facts();
  const al = alerts();
  const drv = f.drivers.slice(0, 9);
  return kpiStrip() + `
  <div class="grid g-main">
    <section class="panel">
      <div class="panel-h"><h2>Needs attention</h2><span class="muted" style="font-size:.85rem">Ranked by impact on the finish date</span></div>

      ${drv.map(i => { const a = m.acts[i]; return `<tr class="click" data-act-open="${i}"><td><span class="mono">${esc(a.code)}</span> ${esc(a.name)}</td><td class="r">${E.fmt(E.finishDate(m, s, i), "short")}</td><td class="r ${s.TF[i] < 0 ? "tone-bad" : ""}">${s.TF[i]}d</td></tr>`; }).join("")}
      </tbody></table></div>
    </section>
  </div>
  ${S.ev.BAC ? `<section class="panel"><div class="panel-h"><h2>Cumulative cost curve</h2>${curveLegend()}</div><div class="chart" id="scurve"></div></section>` : ""}
  <section class="panel"><div class="panel-h"><h2>${aiOn() ? "AI briefing" : "Status briefing"}</h2><div class="actions"><button class="btn primary" data-act="narrative">${ICON.spark}Draft status narrative</button></div></div>
    <div id="brief-host">${S.narrative ? `<div class="doc">${md(S.narrative)}</div>` : `<p class="muted" style="margin:0">Generate a monthly status narrative covering schedule, critical path, cost, health and risk, written from the numbers above.</p>`}</div>
  </section>`;
}

/* ---- welcome ---- */
const FICON = {
  cpm: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="4" width="7" height="3" rx="1"/><rect x="7" y="9" width="9" height="3" rx="1"/><rect x="11" y="14" width="7" height="3" rx="1"/><path d="M9 5.5h2v5M16 10.5h1v5"/></svg>',
  health: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 2.5 16.5 5v5c0 4-3 6.5-6.5 7.5C6.5 16.5 3.5 14 3.5 10V5z"/><path d="m7 10 2 2 4-4.5"/></svg>',
  evm: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 16.5h14M4 14c3-1 4-6 7-7.5s4.5-1 5.5-2"/><circle cx="11" cy="6.5" r="1.4"/></svg>',
  risk: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 16.5h14"/><rect x="4" y="11" width="2.4" height="5.5"/><rect x="8" y="6" width="2.4" height="10.5"/><rect x="12" y="9" width="2.4" height="7.5"/></svg>',
  ai: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2 11.8 8.2 18 10l-6.2 1.8L10 18l-1.8-6.2L2 10l6.2-1.8z"/></svg>',
  out: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 2.5h7l3.5 3.5v11.5H5z"/><path d="M12 2.5V6h3.5M8 10.5h5M8 13.5h5"/></svg>',
};
function vWelcome() {

  const path = k => pts.map((p, i) => (i ? "L" : "M") + (i / (pts.length - 1 || 1) * W).toFixed(1) + " " + (H - 4 - p[k] / mx * (H - 8)).toFixed(1)).join("");
  const feats = [

    ["health", "DCMA 14 point health check", "Scores schedule quality against the standard used in federal reviews, names every offending activity, and explains how to fix it in P6.", "health", "Run health check"],

  return `<section class="hero">

      <h1>Project controls intelligence for <em>Primavera P6</em> schedules</h1>

/* ---- schedule ---- */
function rowsFor(filter) {
  const m = S.m, s = S.s, q = S.q.trim().toLowerCase();
  const openEnds = new Set(S.d.checks[0].items);
  return m.acts.filter(a => {
    if (q && !(a.code + " " + a.name).toLowerCase().includes(q)) return false;
    if (filter === "crit") return a.status !== "C" && s.TF[a.i] <= 0;
    if (filter === "neg") return a.status !== "C" && s.TF[a.i] < 0;
    if (filter === "open") return openEnds.has(a.i);
    if (filter === "active") return a.status === "A";
    if (filter === "late") return a.blFinish != null && E.finishDate(m, s, a.i) > a.blFinish;
    return true;
  });
}
function vSchedule() {
  const F = [["all", "All"], ["crit", "Critical"], ["neg", "Negative float"], ["late", "Late vs baseline"], ["open", "Open ends"], ["active", "In progress"]];
  const rows = rowsFor(S.filter);
  return `<section class="toolbar">
      <div class="seg" role="group" aria-label="Filter">${F.map(([k, l]) => `<button data-filter-set="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join("")}</div>
      <input type="search" id="q" placeholder="Search code or name" value="${esc(S.q)}" aria-label="Search activities">
      <span class="muted" style="font-size:.85rem">${rows.length} shown</span>
    </section>
    <div class="legend"><span><i style="background:var(--bar)"></i>Forecast</span><span><i style="background:var(--crit)"></i>Critical</span><span><i style="background:var(--ink-3)"></i>Actual</span><span><i style="background:var(--bl);height:4px"></i>Baseline</span><span><i style="background:var(--accent);width:2px;height:12px"></i>Data date</span></div>
    <div class="gantt" id="gantt">${gantt(rows)}</div>
    <section class="panel"><div class="panel-h"><h2>Activity register</h2><button class="btn sm" data-act="dl-acts">${ICON.dl}CSV</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Activity</th><th>Status</th><th class="r">Rem dur</th><th class="r">Start</th><th class="r">Finish</th><th class="r">BL finish</th><th class="r">Var</th><th class="r">Float</th><th class="r">Budget</th></tr></thead><tbody>
    ${rows.map(a => { const s = S.s, m = S.m, fin = E.finishDate(m, s, a.i), v = a.blFinish != null ? E.idx(a.blFinish) - E.idx(fin) : null;
      return `<tr class="click" data-act-open="${a.i}"><td class="mono">${esc(a.code)}</td><td>${esc(a.name)}</td><td>${statusChip(a)}</td><td class="r">${a.mile ? "" : a.remDur + "d"}</td><td class="r">${E.fmt(E.startDate(m, s, a.i), "short")}</td><td class="r">${E.fmt(fin, "short")}</td><td class="r muted">${E.fmt(a.blFinish, "short")}</td><td class="r ${v < 0 ? "tone-bad" : ""}">${v == null ? "" : v}</td><td class="r ${s.TF[a.i] < 0 ? "tone-bad" : s.TF[a.i] === 0 ? "tone-warn" : ""}">${s.TF[a.i] == null ? "" : s.TF[a.i] + "d"}</td><td class="r">${a.bac ? money(a.bac) : ""}</td></tr>`; }).join("")}
    </tbody></table></div></section>`;
}
function statusChip(a) {
  return a.status === "C" ? `<span class="chip neutral">Complete</span>` : a.status === "A" ? `<span class="chip warn">${a.pct}%</span>` : `<span class="chip neutral" style="background:transparent;border:1px solid var(--line-2)">Not started</span>`;
}
function gantt(rows) {
  const m = S.m, s = S.s;
  if (!rows.length) return `<p class="muted" style="padding:16px">No activities match this filter.</p>`;
  const LW = 300, RH = 24, HH = 40;
  const starts = rows.map(a => Math.min(a.blStart || Infinity, E.startDate(m, s, a.i)));
  const ends = rows.map(a => Math.max(a.blFinish || 0, E.finishDate(m, s, a.i)));
  const t0 = Math.min(...starts) - 7 * E.DAY, t1 = Math.max(...ends, m.dataDate) + 14 * E.DAY;
  const pxd = 2.1, W = LW + (t1 - t0) / E.DAY * pxd, H = HH + rows.length * RH + 6;
  const X = t => LW + (t - t0) / E.DAY * pxd;
  let g = `<svg width="${Math.ceil(W)}" height="${H}" role="img" aria-label="Gantt chart">`;
  // month grid
  const d0 = new Date(t0); let mt = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), 1);
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  while (mt < t1) { const x = X(mt), d = new Date(mt);
    if (x > LW) g += `<line x1="${x}" x2="${x}" y1="${HH - 14}" y2="${H}" stroke="var(--line)"/>`;
    const nx = X(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
    if (nx - Math.max(x, LW) > 30) g += `<text x="${Math.max(x, LW) + 5}" y="${HH - 18}" font-size="11" style="fill:var(--ink-3)">${MON[d.getUTCMonth()]}${d.getUTCMonth() === 0 || x <= LW + 1 ? " " + d.getUTCFullYear() : ""}</text>`;
    mt = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); }
  g += `<rect x="0" y="0" width="${LW}" height="${H}" fill="var(--surface)"/><line x1="${LW}" x2="${LW}" y1="0" y2="${H}" stroke="var(--line-2)"/>`;
  g += `<text x="12" y="${HH - 18}" font-size="10.5" font-weight="600" letter-spacing=".07em" style="fill:var(--ink-3)">ACTIVITY</text><line x1="0" x2="${W}" y1="${HH - 6}" y2="${HH - 6}" stroke="var(--line-2)"/>`;
  rows.forEach((a, k) => {
    const y = HH + k * RH, cy = y + RH / 2, crit = a.status !== "C" && s.TF[a.i] <= 0;
    g += `<g class="grow" data-act-open="${a.i}" style="cursor:pointer"><rect x="0" y="${y}" width="${W}" height="${RH}" fill="transparent"/>`;
    g += `<text x="12" y="${cy + 4}" font-size="12"><tspan font-family="IBM Plex Mono, monospace" font-size="10.5" style="fill:var(--ink-3)">${esc(a.code)}</tspan><tspan dx="8">${esc(a.name.length > 32 ? a.name.slice(0, 31) + "…" : a.name)}</tspan></text>`;
    if (a.blStart != null && a.blFinish != null) g += a.mile ? "" : `<rect x="${X(a.blStart)}" y="${cy + 5}" width="${Math.max(2, X(a.blFinish + E.DAY) - X(a.blStart))}" height="3" rx="1.5" fill="var(--bl)"/>`;
    const st = E.startDate(m, s, a.i), fi = E.finishDate(m, s, a.i);
    if (a.mile) {
      const x = X(a.finMile ? fi + E.DAY : st), c = a.status === "C" ? "var(--ink-3)" : crit ? "var(--crit)" : "var(--bar)";
      g += `<path d="M${x} ${cy - 6} l6 6 l-6 6 l-6 -6z" fill="${c}"/>`;
    } else {
      const x1 = X(st), x2 = X(fi + E.DAY);
      if (a.status === "C") g += `<rect x="${x1}" y="${cy - 6}" width="${Math.max(2, x2 - x1)}" height="10" rx="2" fill="var(--ink-3)"/>`;
      else if (a.status === "A") { const xd = X(m.dataDate);
        g += `<rect x="${x1}" y="${cy - 6}" width="${Math.max(2, xd - x1)}" height="10" rx="2" fill="var(--ink-3)"/><rect x="${xd}" y="${cy - 6}" width="${Math.max(2, x2 - xd)}" height="10" rx="2" fill="${crit ? "var(--crit)" : "var(--bar)"}"/>`; }
      else g += `<rect x="${x1}" y="${cy - 6}" width="${Math.max(2, x2 - x1)}" height="10" rx="2" fill="${crit ? "var(--crit)" : "var(--bar)"}"/>`;
      if (a.status !== "C" && s.TF[a.i] != null) g += `<text x="${x2 + 5}" y="${cy + 3}" font-size="10" style="fill:${s.TF[a.i] < 0 ? "var(--bad)" : "var(--ink-3)"}">${s.TF[a.i]}d</text>`;
    }
    g += `</g>`;
  });
  const xd = X(m.dataDate);
  g += `<line x1="${xd}" x2="${xd}" y1="${HH - 14}" y2="${H}" stroke="var(--accent)" stroke-width="2"/><text x="${xd + 4}" y="${HH - 4}" font-size="10" font-weight="600" style="fill:var(--accent)">DATA DATE</text>`;
  return g + `</svg>`;
}

/* ---- health ---- */
function vHealth() {
  const d = S.d, r = 38, C = 2 * Math.PI * r, frac = d.passed / 14;
  const col = d.passed < 10 ? "var(--bad)" : d.passed < 13 ? "var(--warn)" : "var(--good)";
  const fmtVal = c => typeof c.value === "string" ? c.value : c.unit === "%" ? pct1(c.value) : c.value.toFixed(2);
  return `<section class="panel score">
    <svg class="ring" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="9"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-dasharray="${C * frac} ${C}" stroke-linecap="round" transform="rotate(-90 46 46)"/><text x="46" y="52" text-anchor="middle" font-family="Barlow Semi Condensed, sans-serif" font-size="22" font-weight="700" style="fill:var(--ink)">${d.passed}/14</text></svg>
    <div style="flex:1;min-width:240px"><h2>DCMA 14 point assessment</h2><p class="muted" style="margin:4px 0 0">${d.inc} incomplete activities assessed at the data date. ${14 - d.passed} checks fail. Thresholds follow the Defense Contract Management Agency guideline used for federal schedule reviews.</p></div>
    <div class="actions">${aiOn() ? `<button class="btn primary" data-act="ai-health">${ICON.spark}Build a fix plan</button>` : ""}<button class="btn" data-act="dl-dcma">${ICON.dl}Report CSV</button></div>
  </section>
  <section class="checks">${d.checks.map(c => {
    const items = [...new Set(c.items)];
    const meter = typeof c.value === "number" && c.unit === "%" ? `<div class="bar-meter" aria-hidden="true"><span style="width:${Math.min(100, c.value)}%;background:${c.pass ? "var(--good)" : "var(--bad)"}"></span></div>` : "";
    return `<article class="check ${c.pass ? "" : "fail"}">
      <div class="top"><span class="eyebrow">${String(c.id).padStart(2, "0")} · ${esc(c.name)}</span>${c.pass ? `<span class="chip good">${ICON.ok}Pass</span>` : `<span class="chip bad">${ICON.x}Fail</span>`}</div>
      <div class="top"><span class="val">${fmtVal(c)}</span><span class="thr">Target ${esc(c.threshold)}</span></div>${meter}
      <p>${esc(c.desc)}.</p>
      ${!c.pass ? `<p><b>Why it matters.</b> ${esc(c.why)}</p><p><b>Fix.</b> ${esc(c.fix)}</p>${c.note ? `<p class="tone-bad">${esc(c.note)}.</p>` : ""}` : ""}
      ${items.length ? `<details ${!c.pass && items.length <= 12 ? "open" : ""}><summary>${items.length} ${items.length === 1 ? "activity" : "activities"}</summary><div class="codes">${items.map(i => `<button data-act-open="${i}" title="${esc(S.m.acts[i].name)}">${esc(S.m.acts[i].code)}</button>`).join("")}</div></details>` : ""}
      ${!c.pass && aiOn() ? `<div><button class="btn sm ghost" data-ai-check="${c.id}">${ICON.spark}Explain with AI</button></div>` : ""}
    </article>`; }).join("")}</section>`;
}

/* ---- cost ---- */
function vCost() {
  const ev = S.ev, m = S.m;
  if (!ev.BAC) return `<section class="panel"><h2>No cost data in this file</h2><p class="muted">Earned value needs resource assignments with budgeted cost (the TASKRSRC table). Load a P6 export that includes resource costs.</p></section>`;
  const tile = (l, v, d, tone) => `<div class="kpi"><span class="eyebrow">${l}</span><span class="v num ${tone || ""}">${v}</span><span class="d">${d}</span></div>`;
  const eacs = [["CPI method", ev.EAC_cpi, "BAC ÷ CPI. Assumes current cost efficiency continues."], ["CPI × SPI method", ev.EAC_cpispi, "AC + remaining work ÷ (CPI × SPI). Penalizes schedule pressure."], ["Bottom up (P6 remaining cost)", ev.EAC_bu, "AC + remaining cost entered in the schedule."]];
  const maxE = Math.max(ev.BAC, ...eacs.map(e => e[1]));
  return `<section class="kpis">
    ${tile("Budget at completion", money(ev.BAC), "Total budgeted cost")}
    ${tile("Planned value", money(ev.PV), "Baseline work due by data date")}
    ${tile("Earned value", money(ev.EV), pct1(100 * ev.EV / ev.BAC) + " of budget earned")}
    ${tile("Actual cost", money(ev.AC), "Cost incurred to date")}
    ${tile("Schedule variance", money(ev.SV), "SPI " + ev.SPI.toFixed(2) + " · SPI(t) " + ev.SPIt.toFixed(2), ev.SV < 0 ? "tone-bad" : "tone-good")}
    ${tile("Cost variance", money(ev.CV), "CPI " + ev.CPI.toFixed(2) + " · TCPI " + ev.TCPI.toFixed(2), ev.CV < 0 ? "tone-bad" : "tone-good")}

  <section class="panel"><div class="panel-h"><h2>Cumulative cost curve</h2>${curveLegend()}</div><div class="chart" id="scurve"></div>
  <p class="muted" style="font-size:.82rem;margin:10px 0 0">Earned value and actual cost are spread across each activity's actual dates. The forecast adds remaining cost along the current early dates. Earned schedule puts performance at ${E.fmt(ev.esDate)}, projecting completion near ${E.fmt(ev.IEACt)} if the current pace holds.</p></section>

      </div></section>
    <section class="panel"><h2 style="margin-bottom:8px">Performance by WBS</h2><div class="tbl-wrap"><table><thead><tr><th>WBS</th><th class="r">BAC</th><th class="r">EV</th><th class="r">AC</th><th class="r">CPI</th><th class="r">SPI</th></tr></thead><tbody>
    ${ev.byWbs.filter(w => w.BAC).map(w => { const wb = m.wbs[w.id] || { name: "Other" };
      const tc = v => v == null ? "" : `<span class="${v < 0.9 ? "tone-bad" : v < 0.98 ? "tone-warn" : ""}">${v.toFixed(2)}</span>`;
      return `<tr><td>${esc(wb.name)}</td><td class="r">${money(w.BAC)}</td><td class="r">${money(w.EV)}</td><td class="r">${money(w.AC)}</td><td class="r">${tc(w.CPI)}</td><td class="r">${tc(w.SPI)}</td></tr>`; }).join("")}
    </tbody></table></div></section>

  const opt = sel => inc.map(a => `<option value="${a.i}" ${sel === a.i ? "selected" : ""}>${esc(a.code)} · ${esc(a.name)}</option>`).join("");

function whatIf() {

function drawSCurve() {
  const host = $("#scurve"); if (!host) return;
  const pts = S.ev.series.points, W = Math.max(320, host.clientWidth), H = W < 520 ? 230 : 290, P = { l: 58, r: 14, t: 12, b: 28 };
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;

  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative planned value, earned value, actual cost and forecast">`;
  for (let v = 0; v <= maxV; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end">${money(v).replace(".00M", "M")}</text>`;
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const d0 = new Date(t0); let mt = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1), k = 0; const every = W < 520 ? 3 : 2;
  while (mt < t1) { const d = new Date(mt); if (k++ % every === 0) g += `<text x="${X(mt)}" y="${H - 8}" text-anchor="middle">${MON[d.getUTCMonth()]}${d.getUTCMonth() === 0 ? " " + String(d.getUTCFullYear()).slice(2) : ""}</text>`; mt = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); }
  const line = (key, col, dash) => { const p = pts.filter(q => q[key] != null); if (!p.length) return ""; return `<path d="${p.map((q, i) => (i ? "L" : "M") + X(q.t).toFixed(1) + " " + Y(q[key]).toFixed(1)).join("")}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" ${dash ? 'stroke-dasharray="5 4"' : ""}/>`; };
  const pvArea = `<path d="M${X(t0)} ${Y(0)}${pts.map(q => "L" + X(q.t).toFixed(1) + " " + Y(q.pv).toFixed(1)).join("")}L${X(t1)} ${Y(0)}Z" fill="var(--s-pv)" opacity="0.07"/>`;
  g += pvArea + line("pv", "var(--s-pv)") + line("fc", "var(--s-fc)", true) + line("ac", "var(--s-ac)") + line("ev", "var(--s-ev)");
  const xd = X(S.m.dataDate);
  g += `<line x1="${xd}" x2="${xd}" y1="${P.t}" y2="${H - P.b}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2 3"/><text x="${xd + 5}" y="${P.t + 10}" style="fill:var(--accent);font-weight:600">Data date</text>`;
  const last = pts.filter(p => p.ev != null).pop();
  if (last) [["ev", "var(--s-ev)"], ["ac", "var(--s-ac)"]].forEach(([k, c]) => g += `<circle cx="${X(last.t)}" cy="${Y(last[k])}" r="4.5" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`);
  const fl = pts[pts.length - 1];

  g += `<line id="xh" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"/><rect x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;

function drawHist() {

  const lo = mc.finishes[0], hi = mc.finishes[mc.finishes.length - 1];

  mc.finishes.forEach(v => bins[Math.min(bins.length - 1, Math.floor((v - lo) / binW))].n++);

  if (f.fm && f.fm.cstrDate) { const tv = E.idx(f.fm.cstrDate) + 1 + (S.s.PF - S.s.EF[f.fm.i]); if (tv >= lo - binW && tv <= hi + binW) g += mark(Math.min(hi, Math.max(lo, tv)), "Target", "var(--bad)"); }

  g += `</svg><div class="tip" id="htip" hidden></div>`;
  host.innerHTML = g;
  const tip = host.querySelector("#htip"), svg = host.querySelector("svg");

      tip.innerHTML = `${E.fmt(E.dateOf(b.a - 1), "short")}${b.b > b.a ? " to " + E.fmt(E.dateOf(b.b - 1), "short") : ""}<br><b>${b.n}</b> runs (${(100 * b.n / mc.N).toFixed(1)}%)`; });
    r.addEventListener("pointerleave", () => tip.hidden = true);
  });
}

      byWbs: ev.byWbs.filter(w => w.BAC).map(w => ({ wbs: (m.wbs[w.id] || {}).name, BAC: Math.round(w.BAC), CPI: w.CPI && +w.CPI.toFixed(2), SPI: w.SPI && +w.SPI.toFixed(2) })) } : "no cost data",
    dcma: d.checks.map(c => ({ check: c.id + " " + c.name, result: c.pass ? "pass" : "fail", value: typeof c.value === "number" ? +c.value.toFixed(2) : c.value, threshold: c.threshold, activities: [...new Set(c.items)].slice(0, 25).map(i => m.acts[i].code).join(","), note: c.note || undefined })),
    activities: m.acts.filter(a => a.status !== "C").map(act),
    completedLate: m.acts.filter(a => a.status === "C" && a.blFinish && a.actFinish > a.blFinish).map(a => a.code + " finished " + (E.idx(a.actFinish) - E.idx(a.blFinish)) + "d late").join("; ")
  };
}
const RULES = `You are a senior project controls analyst (planning, scheduling, earned value, DCMA and EVMS) supporting a project team. You are given computed results for one Primavera P6 schedule as JSON. Rules:
- Ground every statement in the data. Cite activity codes and numbers. Never invent activities, dates or costs.
- Float and durations are in working days. Dates are ISO in the data; write them as "12 Mar 2027".
- Be direct and practical, like a controls lead briefing a project manager. Prefer specific recovery actions (resequencing, concurrency, added crews, constraint changes, scope or procurement moves) and say what each would buy in days where the data supports it.
- Use short paragraphs, "###" headings when the answer has parts, and "-" bullets. No tables. Keep answers under 350 words unless asked for more.`;
let aborter = null;
async function ask(q, opts) {
  if (!aiOn() || S.busy) return;
  S.view = "assistant"; S.chat.push({ role: "user", content: q }); S.busy = true; render();
  const ctx = JSON.stringify(contextPack());
  const turns = [{ role: "user", content: RULES + "\n\nSCHEDULE DATA:\n" + ctx + "\n\nReply with only: Ready." }, { role: "assistant", content: "Ready." }].concat(S.chat);
  S.chat.push({ role: "assistant", content: "" });
  const bubble = () => $("#chat").lastElementChild;
  render(); bubble().innerHTML = `<span class="skeleton">Thinking…</span>`;
  aborter = new AbortController();
  try {
    const { text } = await aiCall(turns, { cache: false, signal: aborter.signal, modelTier: "default", onText: ({ text }) => { S.chat[S.chat.length - 1].content = text; const b = bubble(); if (b) b.innerHTML = md(text); } });
    S.chat[S.chat.length - 1].content = text;
  } catch (e) {
    const last = S.chat[S.chat.length - 1];
    last.content = (e.text || "") + (e.code === "cancelled" ? "" : "\n\n*" + aiError(e.code) + "*");
    if (!last.content.trim()) S.chat.pop();
  }
  S.busy = false; aborter = null; render();
  const c = $("#chat"); if (c) c.lastElementChild?.scrollIntoView({ block: "nearest" });
}
function aiError(code) {
  return ({ not_granted: "The AI analyst needs your permission to run. Allow it when prompted and ask again.", network: "The analyst could not be reached. Check your connection and try again.", rate_limited: "Too many requests at once. Wait a moment and ask again.", cancelled: "Stopped." }[code]) || "The analyst could not answer this time. Try again.";
}
async function makeNarrative() {
  if (aiOn()) {
    S.view = "assistant"; S.narrative = "_Drafting from the schedule data…_"; S.narrativeSource = "AI draft"; render();
    try {
      const prompt = RULES + `\n\nSCHEDULE DATA:\n${JSON.stringify(contextPack())}\n\nWrite the monthly schedule and cost status narrative for the owner's report. Use these "###" sections: Executive summary, Schedule status and critical path, Cost and earned value, Schedule quality (DCMA), Risk outlook, Recommended actions. Up to 550 words.`;
      const { text } = await aiCall(prompt, { modelTier: "default", onText: ({ text }) => { S.narrative = text; const el = $("#narr-doc"); if (el) el.innerHTML = md(text); } });
      S.narrative = text;
    } catch (e) { S.narrative = ruleNarrative(); S.narrativeSource = "Rules engine"; if (e.code !== "cancelled") toast(aiError(e.code) + " Showing the rules engine draft."); }
  } else { S.narrative = ruleNarrative(); S.narrativeSource = "Rules engine"; }

}
function ruleNarrative() {
  const m = S.m, s = S.s, ev = S.ev, d = S.d, f = facts();
  const drv = f.drivers.filter(i => !m.acts[i].mile).slice(0, 5).map(i => `${m.acts[i].code} ${m.acts[i].name}`);
  const late = m.acts.filter(a => a.status === "C" && a.blFinish && a.actFinish > a.blFinish).sort((a, b) => (E.idx(b.actFinish) - E.idx(b.blFinish)) - (E.idx(a.actFinish) - E.idx(a.blFinish))).slice(0, 3);
  const fails = d.checks.filter(c => !c.pass);
  let t = `### Executive summary\nAs of ${E.fmt(m.dataDate)}, ${m.title} forecasts completion on ${E.fmt(f.fin)}, ${f.slip > 0 ? f.slip + " working days behind" : "in line with"} the baseline of ${E.fmt(f.blFin)}.`;
  if (f.fm && f.fmTF < 0) t += ` ${f.fm.name} is forecast ${-f.fmTF} working days past its target of ${E.fmt(f.fm.cstrDate)}.`;
  if (ev.BAC) t += ` The project has earned ${money(ev.EV)} of ${money(ev.BAC)} (${pct1(100 * ev.EV / ev.BAC)}) at an SPI of ${ev.SPI.toFixed(2)} and a CPI of ${ev.CPI.toFixed(2)}.`;
  t += `\n\n### Schedule status and critical path\n${f.done} activities are complete and ${f.active} are in progress. ${f.neg} incomplete activities carry negative float. The driving path runs through:\n${drv.map(x => "- " + x).join("\n")}`;
  if (late.length) t += `\n\nThe largest completed slips were ${late.map(a => `${a.code} ${a.name} (${E.idx(a.actFinish) - E.idx(a.blFinish)} days late)`).join(", ")}.`;
  if (ev.BAC) t += `\n\n### Cost and earned value\nPlanned value is ${money(ev.PV)} against earned value of ${money(ev.EV)}, a schedule variance of ${money(ev.SV)}. Actual cost is ${money(ev.AC)}, a cost variance of ${money(ev.CV)}. Estimates at completion range from ${money(Math.min(ev.EAC_cpi, ev.EAC_cpispi, ev.EAC_bu))} to ${money(Math.max(ev.EAC_cpi, ev.EAC_cpispi, ev.EAC_bu))}. Finishing on budget requires a TCPI of ${ev.TCPI.toFixed(2)}.`;
  t += `\n\n### Schedule quality (DCMA)\nThe schedule passes ${d.passed} of 14 checks. Failing checks: ${fails.map(c => c.name).join(", ") || "none"}.`;
  if (s.overrides.length) t += ` ${s.overrides.map(o => `${m.acts[o.i].code} carries a mandatory constraint that forces it ${o.logic - o.forced} days ahead of its logic`).join("; ")}.`;
  t += `\n\n### Risk outlook\nAcross ${S.mc.N.toLocaleString()} simulation runs the P50 finish is ${E.fmt(f.p50)} and the P80 is ${E.fmt(f.p80)}.${f.pOnTime != null ? ` The chance of meeting ${f.fm.name.toLowerCase()} is ${Math.round(f.pOnTime * 100)}%.` : ""}`;
  t += `\n\n### Recommended actions\n- Develop a recovery plan for the driving path, starting with ${drv[0] || "the first driving activity"}.\n- Correct the ${fails.length} failing schedule quality checks before the next submission${s.overrides.length ? ", beginning with the mandatory constraint" : ""}.\n${ev.CPI < 1 && ev.BAC ? "- Review cost performance in the WBS areas running below 0.95 CPI.\n" : ""}- Commit externally to the P80 date until recovery actions show results.`;
  return t;
}
function md(src) {
  const lines = esc(src).split(/\n/); let out = "", list = false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>").replace(/(^|\s)_(\S.*?)_(?=\s|$|[.,;:])/g, "$1<i>$2</i>").replace(/`(.+?)`/g, '<span class="mono">$1</span>');
  for (const l of lines) {
    const t = l.trim();
    if (/^[-*•] /.test(t)) { if (!list) { out += "<ul>"; list = true; } out += "<li>" + inline(t.slice(2)) + "</li>"; continue; }
    if (list) { out += "</ul>"; list = false; }
    if (/^#{1,4} /.test(t)) out += "<h4>" + inline(t.replace(/^#+ /, "")) + "</h4>";
    else if (t) out += "<p>" + inline(t) + "</p>";
  }
  return out + (list ? "</ul>" : "");
}

/* ---------------- exports ---------------- */
const csv = rows => rows.map(r => r.map(v => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n");
async function save(filename, data) {
  if (S.caps.downloads) {
    try { await S.caps.downloads.save({ filename, data }); } catch (e) { if (e && e.code !== "cancelled" && e.code !== "declined") toast("The file was not saved."); }
    return;
  }
  const type = /\.csv$/.test(filename) ? "text/csv" : /\.md$/.test(filename) ? "text/markdown" : "application/octet-stream";
  const url = URL.createObjectURL(new Blob([data], { type: type + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast("Saved " + filename);
}

    .concat(m.acts.map(a => { const fi = E.finishDate(m, s, a.i); return [a.code, a.name, (m.wbs[a.wbsId] || {}).name, a.status === "C" ? "Complete" : a.status === "A" ? "In progress" : "Not started", a.pct, a.origDur, a.remDur, E.fmt(E.startDate(m, s, a.i), "iso"), E.fmt(fi, "iso"), E.fmt(a.blStart, "iso"), E.fmt(a.blFinish, "iso"), a.blFinish ? E.idx(a.blFinish) - E.idx(fi) : "", s.TF[a.i] ?? "", s.driving.has(a.i) ? "Y" : "", a.bac, a.ac, a.etc]; })));
}

  return csv([["Metric", "Value"], ["Data date", E.fmt(m.dataDate, "iso")], ["BAC", ev.BAC], ["PV", ev.PV.toFixed(0)], ["EV", ev.EV.toFixed(0)], ["AC", ev.AC], ["SV", ev.SV.toFixed(0)], ["CV", ev.CV.toFixed(0)], ["SPI", ev.SPI.toFixed(3)], ["CPI", ev.CPI.toFixed(3)], ["SPI(t)", ev.SPIt.toFixed(3)], ["TCPI", ev.TCPI.toFixed(3)], ["EAC (CPI)", ev.EAC_cpi.toFixed(0)], ["EAC (CPI x SPI)", ev.EAC_cpispi.toFixed(0)], ["EAC (bottom up)", ev.EAC_bu.toFixed(0)], ["VAC", ev.VAC.toFixed(0)], [], ["WBS", "BAC", "PV", "EV", "AC", "CPI", "SPI"]]
    .concat(ev.byWbs.map(w => [(m.wbs[w.id] || {}).name, w.BAC, w.PV.toFixed(0), w.EV.toFixed(0), w.AC, w.CPI ? w.CPI.toFixed(3) : "", w.SPI ? w.SPI.toFixed(3) : ""])));
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }

/* ---------------- events ---------------- */
function afterRender() {

$("#file").addEventListener("change", e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ""; });
document.addEventListener("click", e => {
